<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORGE 表示検証</title><style>body{margin:0;background:#111b23;color:#e7e8df;font:14px system-ui;display:flex;gap:20px;padding:16px}aside{width:200px;flex-shrink:0}button{display:block;width:100%;padding:12px;margin:10px 0;background:#263d49;color:white;border:1px solid #80918c;border-radius:8px}p{line-height:1.7;font-size:12px}iframe{border:1px solid #61716d;flex:none;width:390px;height:844px;background:#172a31}</style><aside><h1>FORGE 表示検証</h1><p>検証専用の進行です。通常のゲームのセーブとは別に保存されます。</p><button data-w="390" data-h="844">390 × 844</button><button data-w="375" data-h="667">375 × 667</button><button data-w="1000" data-h="840">1000 × 840</button><p>画面幅の切替は進行を保持します。通常版は index.html から開いてください。</p></aside><iframe title="検証用ゲーム" src="./index.html?qa=visual09"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{const f=document.querySelector('iframe');f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px';};</script></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15262b"><title>町工場 / FORGE</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><div><small>FACTORY MANAGEMENT · 01</small><h1>町工場 <span>FORGE</span></h1></div><button id="menu" aria-label="保存と設定">•••</button></header><section class="metrics"><div><small>運転資金</small><b id="cash"></b></div><div><small>出荷実績</small><b id="deliveries"></b></div><div><small>工場時間</small><b id="clock"></b></div></section><section class="goal"><span class="dot"></span><div><strong id="goal"></strong><small id="hint"></small></div></section><section id="scene"><canvas id="world" aria-label="工場配置図。設備は設備タブからも選択できます"></canvas><div class="scene-top"><span id="floor">第一工場 · 8 × 6</span><div><button id="minus" aria-label="縮小">−</button><button id="plus" aria-label="拡大">＋</button></div></div><div id="placeHint" hidden></div><div class="scene-bottom"><span id="activity">稼働準備</span><div class="speeds"><button data-speed="0">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="3">3×</button></div></div></section><button id="flow" aria-label="工程ごとの待ち数と設備を確認"><small>工程待ち</small><span id="flowText"></span><b>›</b></button><section class="order-strip"><div><small>PRODUCTION BOARD</small><strong id="orderTitle">最初の注文を受けよう</strong></div><button id="orderAction">注文を見る ↗</button><div id="orderProgress"></div></section><div id="toast" role="status" aria-live="polite"></div><nav><button data-panel="orders" class="nav-primary"><span>▤</span>受注</button><button data-panel="machines"><span>▦</span>設備</button><button data-panel="workers"><span>♙</span>職人</button><button data-panel="finance"><span>↗</span>経営</button></nav><footer>開発試作 v0.3 · 生産中の中断は自動保存</footer></main><dialog id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2><button id="close" aria-label="閉じる">✕</button></div><div id="sheetNotice" role="status" hidden></div><div id="sheetBody"></div></dialog><script type="module" src="app.mjs"></script></body></html>

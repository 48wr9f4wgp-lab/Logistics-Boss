<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172321">
  <meta name="description" content="マチコバ！ — 小さな工場、大きな夢。職人と設備を育てる町工場経営ゲーム。">
  <meta name="application-name" content="マチコバ！">
  <title>マチコバ！ — 小さな工場、大きな夢。</title>
  <link rel="stylesheet" href="style.css?v=0.13">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-orders" viewBox="0 0 24 24"><path d="M8 4H5v17h14V4h-3M9 3h6v4H9zM8 11h8M8 15h6"/></symbol>
    <symbol id="i-machine" viewBox="0 0 24 24"><path d="M4 20h16M6 20v-6h12v6M8 14V4h9v4h-6v6M15 8v4M4 14h16M10 17h4"/></symbol>
    <symbol id="i-worker" viewBox="0 0 24 24"><path d="M7 9V7a5 5 0 0 1 10 0v2M5 9h14M12 2v4M8 10v2a4 4 0 0 0 8 0v-2M4 22v-3c0-3 4-4 8-4s8 1 8 4v3M8 16v6M16 16v6"/></symbol>
    <symbol id="i-growth" viewBox="0 0 24 24"><path d="M4 20V4M4 20h17M8 16v-4M13 16V8M18 16V5M7 7l5-4 6-1"/></symbol>
    <symbol id="i-center" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M9 12h6M12 9v6"/></symbol>
    <symbol id="i-label" viewBox="0 0 24 24"><path d="M3 5h8l10 10-6 6L3 9z"/><circle cx="7.5" cy="8" r="1"/></symbol>
    <symbol id="i-workshop" viewBox="0 0 32 32"><path fill-rule="evenodd" d="M5 25V13l7 4v-6l8 5V6h6v19H5zm3-3h3v-4H8zm6 0h3v-4h-3zm7 0h3v-4h-3z"/></symbol>
  </defs></svg>
  <main id="app">
    <header>
      <div class="brand"><div class="brand-mark"><svg aria-hidden="true"><use href="#i-workshop"/></svg></div><div><h1>マチコバ！</h1><small>小さな工場、大きな夢。</small></div></div>
      <div class="header-actions"><div class="wallet"><small>手元資金</small><b id="cash">¥5,500</b></div><button id="menu" aria-haspopup="dialog">管理</button></div>
    </header>
    <section id="scene" aria-label="町工場">
      <canvas id="world" aria-label="町工場の設備と職人。操作の工程待ちからも設備を選べます"></canvas>
      <details id="controls"><summary>操作</summary>
        <div class="toolbox">
          <div class="tool-row"><span>再生速度</span><div class="speeds" role="group" aria-label="再生速度"><button data-speed="0" aria-label="一時停止">Ⅱ</button><button data-speed="1" aria-label="等速">1×</button><button data-speed="3" aria-label="3倍速">3×</button></div></div>
          <div class="tool-row"><span>表示</span><div><button id="minus" aria-label="縮小">−</button><button id="plus" aria-label="拡大">＋</button><button id="viewReset">全景</button><button id="labels" aria-pressed="false">設備名</button></div></div>
          <div id="flow" role="group" aria-label="工程待ち。押すと設備を選択"><small>工程待ち</small></div>
          <small id="activity"></small>
        </div>
      </details>
      <div id="placeHint" hidden></div>
      <aside id="machineQuick" aria-label="選択した設備" hidden>
        <div class="quick-head"><strong id="machineTitle"></strong><button id="quickClose" aria-label="設備の選択を解除">✕</button></div>
        <div id="machineWorker"></div><small id="machineQueue"></small><div id="machineEffect"></div>
        <div class="quick-actions"><button id="quickMove">移動</button><button id="quickUpgrade"></button><button id="quickDetail">詳細</button></div>
      </aside>
    </section>
    <section class="order-strip" aria-label="次の行動">
      <div class="ticket-copy"><small id="ticketLabel">最初の注文</small><strong id="orderTitle"></strong><small id="orderHint"></small></div>
      <button id="orderAction" aria-describedby="orderTitle orderHint">受注する</button>
      <div id="orderProgress" aria-hidden="true"></div>
    </section>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet-head"><h2 id="sheetTitle"></h2><button id="close" aria-label="工場へ戻る">工場へ戻る</button></div><div id="sheetNotice" role="status" hidden></div><div id="sheetBody"></div></dialog>
  <script type="module" src="app.mjs?v=0.14"></script>
</body>
</html>

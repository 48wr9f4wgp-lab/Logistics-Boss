<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15262b"><title>町工場 / FORGE</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><div><small>小さな工場から、大きな仕事へ</small><h1>町工場 <span>FORGE</span></h1></div><button id="menu" aria-label="保存と設定">⚙</button></header><section class="metrics"><div><small>運転資金</small><b id="cash"></b></div><div><small>出荷実績</small><b id="deliveries"></b></div><div><small>工場時間</small><b id="clock"></b></div></section><section class="goal"><span class="dot"></span><div><strong id="goal"></strong><small id="hint"></small></div><button id="growthAction">成長案件 ›</button></section><section id="scene"><canvas id="world" aria-label="町工場。ドラッグで移動、＋−で拡大縮小。設備は下の工程待ちボタンからも選択できます"></canvas><div class="scene-top"><span id="floor">第一工場 · 8 × 6</span><div><button id="viewReset" aria-label="作業エリアに視点を戻す">作業</button><button id="minus" aria-label="縮小">−</button><button id="plus" aria-label="拡大">＋</button></div></div><div id="placeHint" hidden></div><aside id="machineQuick" aria-label="選択した設備" hidden><div class="quick-head"><strong id="machineTitle"></strong><button id="quickClose" aria-label="設備の選択を解除">✕</button></div><div id="machineWorker"></div><small id="machineQueue"></small><div id="machineEffect"></div><div class="quick-actions"><button id="quickMove">移動</button><button id="quickUpgrade"></button><button id="quickDetail">詳細</button></div></aside><div class="scene-bottom"><span id="activity">稼働準備</span><div class="speeds"><button data-speed="0">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="3">3×</button></div></div></section><div id="flow" role="group" aria-label="工程待ち。押すと設備を選択"><small>工程</small></div><section class="order-strip"><div><small>進行中の仕事</small><strong id="orderTitle">最初の注文を受けよう</strong><small id="orderHint">受注 → 完成まで進める → 出荷</small></div><div class="order-actions"><button id="orderAction" aria-describedby="orderHint">注文を見る ↗</button><button id="orderMore" hidden>注文一覧</button></div><div id="orderProgress"></div></section><div id="toast" role="status" aria-live="polite"></div><nav><button data-panel="orders" class="nav-primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H5v17h14V4h-3M8 3h8v4H8zM8 12h8M8 16h6"/></svg>受注</button><button data-panel="machines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9l6 4V8l6 5V3h5v18zM6 17h1m4 0h1m4 0h1"/></svg>設備</button><button data-panel="workers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14M7 10V8a5 5 0 0 1 10 0v2M12 2v5M8 12a4 4 0 0 0 8 0M4 22v-2a8 5 0 0 1 16 0v2"/></svg>職人</button><button data-panel="finance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M6 16l5-5 4 2 6-8M16 5h5v5"/></svg>経営</button></nav><footer>開発試作 v0.9 · 生産中の中断は自動保存</footer></main><dialog id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2><button id="close" aria-label="閉じる">✕</button></div><div id="sheetNotice" role="status" hidden></div><div id="sheetBody"></div></dialog><script type="module" src="app.mjs"></script></body></html>

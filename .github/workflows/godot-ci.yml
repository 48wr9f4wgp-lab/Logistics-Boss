name: FLOTRA Godot CI

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-ci.yml'
  workflow_dispatch:
    inputs:
      candidate_desktop_only:
        description: 'Run only pinned beaf397 candidate desktop and source attestation; not full CI'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  godot-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.candidate_desktop_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Godot version
        run: godot --version

      - name: Parse/import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --editor --quit 2>&1 | tee /tmp/godot-parse-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' /tmp/godot-parse-import.log; then
            echo 'Godot parse/import emitted an engine/script error'
            exit 1
          fi

      - name: Interaction and truthful-flow presentation regressions
        env:
          GODOT_BIN: godot
        run: |
          bash godot/tools/run_polish_checks.sh \
            world_zone_input_smoke \
            window_focus_input_smoke \
            packing_presentation_smoke \
            blender_workbench_smoke \
            presentation_cache_smoke \
            selected_routes_visibility_smoke \
            warehouse_cohesion_smoke \
            hud_cohesion_smoke \
            player_journey_smoke \
            staffing_return_journey_smoke \
            zone_action_feedback_smoke \
            save_preservation_smoke \
            save_preservation_review_smoke \
            save_status_journey_smoke

      - name: Domain simulation smoke
        run: godot --headless --path godot --script res://tests/sim_smoke.gd

      - name: Flow measurement open-orders smoke
        run: godot --headless --path godot --script res://tests/flow_measurement_open_orders_smoke.gd

      - name: Economy pacing report
        run: godot --headless --path godot --script res://tests/economy_pacing_report.gd

      - name: Economy progression pacing audit
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path godot --script res://tests/economy_progression_pacing_audit.gd 2>&1 | tee /tmp/economy-progression-pacing-audit.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' /tmp/economy-progression-pacing-audit.log; then
            echo 'Economy progression pacing audit emitted an engine/script error'
            exit 1
          fi

      - name: Rank 2 readiness scout
        run: godot --headless --path godot --script res://tests/rank2_readiness_scout.gd

      - name: Rank 2 entry smoke
        run: godot --headless --path godot --script res://tests/rank2_entry_smoke.gd

      - name: Rank 2 facility smoke
        run: godot --headless --path godot --script res://tests/rank2_facility_smoke.gd

      - name: Rank 2 zone pacing report
        run: godot --headless --path godot --script res://tests/rank2_zone_pacing_report.gd

      - name: Rank 2 post-zone frontier
        run: godot --headless --path godot --script res://tests/rank2_post_zone_frontier.gd

      - name: Rank 2 workload wave smoke
        run: godot --headless --path godot --script res://tests/workload_wave_smoke.gd

      - name: Rank 2 workload wave pacing report
        run: godot --headless --path godot --script res://tests/workload_wave_pacing_report.gd

      - name: Rank 3 readiness scout

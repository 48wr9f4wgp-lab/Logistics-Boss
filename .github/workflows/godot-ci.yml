name: Logistics Boss Godot CI

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Godot version
        run: godot --version

      - name: Parse/import project
        run: godot --headless --path godot --editor --quit

      - name: Domain simulation smoke
        run: godot --headless --path godot --script res://tests/sim_smoke.gd

      - name: Economy pacing report
        run: godot --headless --path godot --script res://tests/economy_pacing_report.gd

      - name: Rank 2 readiness scout
        run: godot --headless --path godot --script res://tests/rank2_readiness_scout.gd

      - name: Rank 2 entry smoke
        run: godot --headless --path godot --script res://tests/rank2_entry_smoke.gd

      - name: Rank 2 facility smoke
        run: godot --headless --path godot --script res://tests/rank2_facility_smoke.gd

      - name: Rank 2 zone pacing report
        run: godot --headless --path godot --script res://tests/rank2_zone_pacing_report.gd

      - name: Rank 2 post-zone frontier
        run: godot --headless --path godot --script res://tests/rank2_post_zone_frontier.gd

      - name: Rank 2 workload wave smoke
        run: godot --headless --path godot --script res://tests/workload_wave_smoke.gd

      - name: Rank 2 workload wave pacing report
        run: godot --headless --path godot --script res://tests/workload_wave_pacing_report.gd

      - name: Rank 3 readiness scout
        run: godot --headless --path godot --script res://tests/rank3_readiness_scout.gd

      - name: Rank 3 intervention scout
        run: godot --headless --path godot --script res://tests/rank3_intervention_scout.gd

      - name: Rank 3 intake growth scout
        run: godot --headless --path godot --script res://tests/rank3_intake_growth_scout.gd

      - name: Rank 3 Receiving Annex smoke
        run: godot --headless --path godot --script res://tests/rank3_receiving_annex_smoke.gd

      - name: Rank 3 Receiving Annex pacing report
        run: godot --headless --path godot --script res://tests/rank3_receiving_annex_pacing_report.gd

      - name: Rank 3 post-Annex frontier
        run: godot --headless --path godot --script res://tests/rank3_post_annex_frontier.gd

      - name: Rank 2 facility UI smoke
        run: godot --headless --path godot --script res://tests/rank2_facility_ui_smoke.gd

      - name: Rank 3 UI smoke
        run: godot --headless --path godot --script res://tests/rank3_ui_smoke.gd

      - name: Rank 2 facility visual smoke
        run: godot --headless --path godot --script res://tests/rank2_facility_visual_smoke.gd

      - name: Rank 3 visual smoke
        run: godot --headless --path godot --script res://tests/rank3_visual_smoke.gd

      - name: Japanese font glyph smoke
        run: godot --headless --path godot --script res://tests/font_smoke.gd

      - name: Warehouse visual readability smoke
        run: godot --headless --path godot --script res://tests/visual_readability_smoke.gd

      - name: Full scene runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --quit-after 120 2>&1 | tee /tmp/godot-runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' /tmp/godot-runtime.log; then
            echo 'Godot full-scene runtime emitted an error'
            exit 1
          fi

      - name: Web engineering-preview export
        run: |
          rm -rf godot-web
          mkdir -p godot-web
          godot --headless --path godot --export-release Web ../godot-web/index.html
          test -s godot-web/index.html
          test -s godot-web/index.wasm
          test -s godot-web/index.pck

      - name: Upload engineering-preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: logistics-boss-godot-web-preview
          path: godot-web
          if-no-files-found: error
          retention-days: 7

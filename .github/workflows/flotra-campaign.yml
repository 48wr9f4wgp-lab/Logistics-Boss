name: FLOTRA Campaign Regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'flotra-campaign/**'
      - 'docs/godot-jobs-preview/**'
      - '.github/workflows/flotra-campaign.yml'
      - 'FLOTRA_DISPATCH_ARTIFACTS_2026-10-07.json'
      - 'FLOTRA_VISUAL_GROWTH_ARTIFACTS_2026-10-07.json'
      - 'FLOTRA_VISUAL_ONLY_ARTIFACTS_2026-10-08.json'
      - 'FLOTRA_SAVE_READINESS_ARTIFACTS_2026-10-08.json'
  push:
    branches: [main]
    paths:
      - 'flotra-campaign/**'
      - 'docs/godot-jobs-preview/**'
      - '.github/workflows/flotra-campaign.yml'
      - 'FLOTRA_DISPATCH_ARTIFACTS_2026-10-07.json'
      - 'FLOTRA_VISUAL_GROWTH_ARTIFACTS_2026-10-07.json'
      - 'FLOTRA_VISUAL_ONLY_ARTIFACTS_2026-10-08.json'
      - 'FLOTRA_SAVE_READINESS_ARTIFACTS_2026-10-08.json'
permissions:
  contents: read
jobs:
  campaign-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Campaign, save safety, and phone input tests
        run: bash flotra-campaign/test.sh
      - name: Independent pinned historical-save and route adversarial checks
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 0a5a71ee3e88100373fcb77aae685bd4f52a7c24
          bash flotra-campaign/tests/release/run_experience_adversarial.sh
  phone-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dpr: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exported phone CSS, DPR, resize and touch regression
        env:
          FLOTRA_TEST_DPRS: ${{ matrix.dpr }}
        shell: bash
        run: |
          python3 -m http.server 8812 --bind 127.0.0.1 --directory docs > /tmp/flotra-browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" node flotra-campaign/tests/release/browser_growth_geometry.cjs http://127.0.0.1:8812/godot-jobs-preview/ build/browser-phone
      - uses: chickensoft-games/setup-godot@v2
        if: matrix.dpr == 1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Actual Web serialized-size boundary and quota regression
        if: matrix.dpr == 1
        shell: bash
        run: |
          bash flotra-campaign/tests/release/export_save_size_web.sh build/save-size-export
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" node flotra-campaign/tests/release/browser_save_size.cjs build/save-size-export build/browser-phone/save-size
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-browser-phone-dpr-${{ matrix.dpr }}
          path: build/browser-phone
          retention-days: 7
  growth-browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Build isolated earned-state fixtures
        shell: bash
        run: |
          godot --headless --editor --path flotra-campaign --import
          mkdir -p build/growth-fixtures
          FLOTRA_GROWTH_FIXTURES="$PWD/build/growth-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Test earned growth, old save and mature warehouse
        shell: bash
        run: |
          python3 -m http.server 8820 --bind 127.0.0.1 --directory docs/godot-jobs-preview > /tmp/flotra-growth-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_growth_journey.cjs http://127.0.0.1:8820/ build/growth-browser-journey build/growth-fixtures
      - name: Capture ordinary-view purchase and actual packing pixels
        shell: bash
        run: |
          # Native rendered evidence only; not WebGL timing or physical-phone proof.
          # Reuse the unchanged, source-hashed capture script and earned fixtures.
          profile="$RUNNER_TEMP/flotra-native-visual-profile"
          mkdir -p "$profile/home" "$profile/data" "$profile/config" "$profile/cache" build/native-visual-growth
          test -s build/growth-fixtures/late.json
          HOME="$profile/home" XDG_DATA_HOME="$profile/data" XDG_CONFIG_HOME="$profile/config" XDG_CACHE_HOME="$profile/cache" \
            FLOTRA_GROWTH_FIXTURES="$PWD/build/growth-fixtures" FLOTRA_VISUAL_OUTPUT="$PWD/build/native-visual-growth" \
            LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a -s "-screen 0 1280x1024x24" \
            godot --path flotra-campaign --rendering-method gl_compatibility --script res://tests/release/visual_growth_capture.gd \
            2>&1 | tee build/native-visual-growth/engine.log
          python3 - <<'PY_CAPTURE'
          import json
          from pathlib import Path
          output = Path("build/native-visual-growth")
          report = json.loads((output / "result.json").read_text())
          rows = {row["name"]: row for row in report["results"]}
          for width in [375, 390]:
              before = rows[f"{width}-before-purchase"]
              after = rows[f"{width}-after-purchase"]
              active = rows[f"{width}-active-overview"]
              assert not before["machineVisible"] and after["machineVisible"]
              assert "auto_pack" not in before["upgrades"] and "auto_pack" in after["upgrades"]
              assert active["machineVisible"] and active["packCargo"] >= 0
          for frame in range(24):
              assert f"motion-{frame:02d}" in rows
          assert all(row["domainUnchanged"] and row["savingDisabled"] for row in rows.values())
          assert all((output / (name + ".png")).stat().st_size > 0 for name in rows)
          print(f"Verified {len(rows)} native normal-camera captures; no browser-performance claim.")
          PY_CAPTURE
      - name: Preserve growth browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-growth-browser-journey
          path: build/growth-browser-journey
          retention-days: 7
      - name: Preserve native purchase and packing visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-native-visual-growth
          path: build/native-visual-growth
          if-no-files-found: error
          retention-days: 7

  camera-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep all twelve existing camera cases and every assertion. DPR 3's
        # four sequential viewports exceeded the unchanged 20-minute job cap.
        include:
          - dpr: 1
            viewports: '375x567,375x667,390x844,430x932'
            group: all
          - dpr: 2
            viewports: '375x567,375x667,390x844,430x932'
            group: all
          - dpr: 3
            viewports: '375x567,375x667'
            group: compact
          - dpr: 3
            viewports: '390x844,430x932'
            group: large
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Build isolated earned-state fixtures
        shell: bash
        run: |
          godot --headless --editor --path flotra-campaign --import
          mkdir -p build/camera-fixtures
          FLOTRA_GROWTH_FIXTURES="$PWD/build/camera-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Test real camera gestures and recovery
        env:
          FLOTRA_TEST_DPRS: ${{ matrix.dpr }}
          FLOTRA_TEST_CASES: ${{ matrix.viewports }}
        shell: bash
        run: |
          python3 -m http.server 8826 --bind 127.0.0.1 --directory docs/godot-jobs-preview > /tmp/flotra-camera-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_camera_controls.cjs http://127.0.0.1:8826/ build/camera-browser build/camera-fixtures
      - name: Preserve camera browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-camera-browser-dpr-${{ matrix.dpr }}-${{ matrix.group }}
          path: build/camera-browser
          retention-days: 7

  preparation-browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: ['375x567', '390x844']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Build isolated earned-state fixtures
        shell: bash
        run: |
          godot --headless --editor --path flotra-campaign --import
          mkdir -p build/preparation-fixtures
          FLOTRA_GROWTH_FIXTURES="$PWD/build/preparation-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
          FLOTRA_UPGRADE_FIXTURES="$PWD/build/upgrade-fixtures" godot --headless --path flotra-campaign --script res://tests/release/upgrade_visibility.gd
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Test preparation, comparison, save and canceled input
        env:
          FLOTRA_PREPARATION_CASES: quickstart-${{ matrix.viewport }},fresh-${{ matrix.viewport }},mature-${{ matrix.viewport }}
          FLOTRA_UPGRADE_VIEWPORTS: ${{ matrix.viewport }}
        shell: bash
        run: |
          python3 -m http.server 8830 --bind 127.0.0.1 --directory docs/godot-jobs-preview > /tmp/flotra-preparation-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_preparation_journey.cjs http://127.0.0.1:8830/ build/preparation-browser-journey build/preparation-fixtures docs/godot-jobs-preview
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_upgrade_visibility.cjs http://127.0.0.1:8830/ build/preparation-browser-journey/upgrade-visibility build/upgrade-fixtures docs/godot-jobs-preview
      - name: Preserve preparation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-preparation-browser-${{ matrix.viewport }}
          path: build/preparation-browser-journey
          retention-days: 7

  combined-renderer-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTROL_SHA: a7c60e8c86785137a90b517227b5def8b329c1bc
      FLOTRA_COMBINED_PROVENANCE: FLOTRA_SAVE_READINESS_ARTIFACTS_2026-10-08.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Prepare immutable public control and identical earned fixture
        run: |
          git fetch --no-tags --depth=1 origin "$CONTROL_SHA"
          mkdir -p build/pr154-control build/combined-fixtures build/combined-renderer
          git archive "$CONTROL_SHA" docs/godot-jobs-preview | tar -x -C build/pr154-control
          godot --headless --editor --path flotra-campaign --import
          FLOTRA_GROWTH_FIXTURES="$PWD/build/combined-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
      - name: Install one pinned browser for the fixed comparison
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare public and exact-head builds once in A-B-B-A order
        shell: bash
        run: |
          python3 -m http.server 8850 --bind 127.0.0.1 --directory build/pr154-control/docs/godot-jobs-preview > build/combined-renderer/control-server.log 2>&1 &
          control=$!
          python3 -m http.server 8851 --bind 127.0.0.1 --directory docs/godot-jobs-preview > build/combined-renderer/candidate-server.log 2>&1 &
          candidate=$!
          trap 'kill "$control" "$candidate" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" node flotra-campaign/tests/release/browser_combined_performance.cjs http://127.0.0.1:8850/ http://127.0.0.1:8851/ build/combined-renderer build/combined-fixtures build/pr154-control/docs/godot-jobs-preview docs/godot-jobs-preview "$CONTROL_SHA" "$(git rev-parse HEAD)"
      - name: Preserve every control and candidate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-combined-renderer-control
          path: build/combined-renderer
          retention-days: 7

  desktop-save-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Full official Web export and synthetic legacy fixtures
        shell: bash
        run: |
          test "$(godot --version)" = '4.7.2.stable.official.ed1daf0bf'
          templates="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates"
          test -s "$templates/4.7.2.stable/web_release.zip"
          profile="$RUNNER_TEMP/flotra-readiness-native"
          mkdir -p "$profile"/{home,data,config,cache} build/writer-fixtures build/writer-readiness
          mkdir -p "$profile/data/godot"
          ln -s "$templates" "$profile/data/godot/export_templates"
          export HOME="$profile/home" XDG_DATA_HOME="$profile/data" XDG_CONFIG_HOME="$profile/config" XDG_CACHE_HOME="$profile/cache"
          godot --headless --editor --path flotra-campaign --import
          FLOTRA_GROWTH_FIXTURES="$PWD/build/writer-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
          bash flotra-campaign/export_web.sh build/writer-web
          printf '<!doctype html><title>Writer lifecycle fixture</title><p>Disposable CI navigation</p>\n' > build/writer-web/writer-away.html
      - name: Inspect only approved generated scene ID fields
        shell: bash
        run: |
          profile="$RUNNER_TEMP/flotra-readiness-inspector"
          mkdir -p "$profile"/{home,data,config,cache}
          export HOME="$profile/home" XDG_DATA_HOME="$profile/data" XDG_CONFIG_HOME="$profile/config" XDG_CACHE_HOME="$profile/cache"
          SCENE_ID_REPORT="$PWD/build/writer-readiness/candidate-scenes.json" godot --headless --main-pack "$PWD/docs/godot-jobs-preview/index.pck" --script "$PWD/scripts/flotra_inspect_scene_ids.gd"
          SCENE_ID_REPORT="$PWD/build/writer-readiness/exported-scenes.json" godot --headless --main-pack "$PWD/build/writer-web/index.pck" --script "$PWD/scripts/flotra_inspect_scene_ids.gd"
          python3 flotra-campaign/tests/release/diagnose_writer_pack.py docs/godot-jobs-preview/index.pck build/writer-web/index.pck build/writer-readiness/pack-resource-diagnostic.json
      - name: Verify exact source, engine and bounded export coherence
        id: export-check
        continue-on-error: true
        run: python3 flotra-campaign/tests/release/verify_writer_export.py build/writer-web build/writer-readiness
      - name: Install isolated desktop browser
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Actual desktop startup, ownership, mouse and lifecycle checks
        shell: bash
        run: |
          cp -a docs/godot-jobs-preview build/writer-committed
          printf '<!doctype html><title>Writer lifecycle fixture</title><p>Disposable CI navigation</p>\n' > build/writer-committed/writer-away.html
          python3 - <<'PY_IDENTITY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('FLOTRA_SAVE_READINESS_ARTIFACTS_2026-10-08.json').read_text())
          actual = {name: hashlib.sha256((Path('build/writer-committed') / name).read_bytes()).hexdigest() for name in manifest['candidateAssetsSHA256']}
          assert actual == manifest['candidateAssetsSHA256'], 'Browser must serve exact committed qualified bytes'
          print('DESKTOP_COMMITTED_WEB_IDENTITY ' + json.dumps(actual))
          PY_IDENTITY
          python3 -m http.server 8860 --bind 127.0.0.1 --directory build/writer-committed > build/writer-readiness/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_writer_readiness.cjs http://127.0.0.1:8860/ build/writer-readiness build/writer-fixtures
      - name: Enforce full-export comparison
        if: always() && steps.export-check.outcome != 'success'
        run: |
          echo 'Export coherence failed beyond the approved generated-ID boundary; preserve all evidence.'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flotra-desktop-save-readiness
          path: |
            build/writer-readiness
            build/writer-web
          retention-days: 7

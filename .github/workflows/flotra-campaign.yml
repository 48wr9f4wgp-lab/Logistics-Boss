name: FLOTRA Campaign Regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'flotra-campaign/**'
      - 'docs/godot-jobs-preview/**'
      - '.github/workflows/flotra-campaign.yml'
  push:
    branches: [main]
    paths:
      - 'flotra-campaign/**'
      - 'docs/godot-jobs-preview/**'
      - '.github/workflows/flotra-campaign.yml'
permissions:
  contents: read
jobs:
  campaign-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Campaign, save safety, and phone input tests
        run: bash flotra-campaign/test.sh
  phone-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dpr: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exported phone CSS, DPR, resize and touch regression
        env:
          FLOTRA_TEST_DPRS: ${{ matrix.dpr }}
        shell: bash
        run: |
          python3 -m http.server 8812 --bind 127.0.0.1 --directory docs > /tmp/flotra-browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" node flotra-campaign/tests/release/browser_phone_geometry.cjs http://127.0.0.1:8812/godot-jobs-preview/ build/browser-phone
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-browser-phone-dpr-${{ matrix.dpr }}
          path: build/browser-phone
          retention-days: 7

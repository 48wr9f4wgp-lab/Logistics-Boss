name: FLOTRA Campaign Regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'flotra-campaign/**'
      - 'docs/godot-jobs-preview/**'
      - '.github/workflows/flotra-campaign.yml'
  push:
    branches: [main]
    paths:
      - 'flotra-campaign/**'
      - 'docs/godot-jobs-preview/**'
      - '.github/workflows/flotra-campaign.yml'
permissions:
  contents: read
jobs:
  campaign-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Campaign, save safety, and phone input tests
        run: bash flotra-campaign/test.sh
      - name: Independent pinned historical-save and route adversarial checks
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 0a5a71ee3e88100373fcb77aae685bd4f52a7c24
          bash flotra-campaign/tests/release/run_experience_adversarial.sh
  phone-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dpr: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exported phone CSS, DPR, resize and touch regression
        env:
          FLOTRA_TEST_DPRS: ${{ matrix.dpr }}
        shell: bash
        run: |
          python3 -m http.server 8812 --bind 127.0.0.1 --directory docs > /tmp/flotra-browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" node flotra-campaign/tests/release/browser_growth_geometry.cjs http://127.0.0.1:8812/godot-jobs-preview/ build/browser-phone
      - uses: chickensoft-games/setup-godot@v2
        if: matrix.dpr == 1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Actual Web serialized-size boundary and quota regression
        if: matrix.dpr == 1
        shell: bash
        run: |
          bash flotra-campaign/tests/release/export_save_size_web.sh build/save-size-export
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" node flotra-campaign/tests/release/browser_save_size.cjs build/save-size-export build/browser-phone/save-size
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-browser-phone-dpr-${{ matrix.dpr }}
          path: build/browser-phone
          retention-days: 7
  growth-browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Build isolated earned-state fixtures
        shell: bash
        run: |
          godot --headless --editor --path flotra-campaign --import
          mkdir -p build/growth-fixtures
          FLOTRA_GROWTH_FIXTURES="$PWD/build/growth-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Test earned growth, old save and mature warehouse
        shell: bash
        run: |
          python3 -m http.server 8820 --bind 127.0.0.1 --directory docs/godot-jobs-preview > /tmp/flotra-growth-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_growth_journey.cjs http://127.0.0.1:8820/ build/growth-browser-journey build/growth-fixtures
      - name: Preserve growth browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-growth-browser-journey
          path: build/growth-browser-journey
          retention-days: 7

  camera-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dpr: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Build isolated earned-state fixtures
        shell: bash
        run: |
          godot --headless --editor --path flotra-campaign --import
          mkdir -p build/camera-fixtures
          FLOTRA_GROWTH_FIXTURES="$PWD/build/camera-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Test real camera gestures and recovery
        env:
          FLOTRA_TEST_DPRS: ${{ matrix.dpr }}
        shell: bash
        run: |
          python3 -m http.server 8826 --bind 127.0.0.1 --directory docs/godot-jobs-preview > /tmp/flotra-camera-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_camera_controls.cjs http://127.0.0.1:8826/ build/camera-browser build/camera-fixtures
      - name: Preserve camera browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-camera-browser-dpr-${{ matrix.dpr }}
          path: build/camera-browser
          retention-days: 7

  preparation-browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: ['375x567', '390x844']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Build isolated earned-state fixtures
        shell: bash
        run: |
          godot --headless --editor --path flotra-campaign --import
          mkdir -p build/preparation-fixtures
          FLOTRA_GROWTH_FIXTURES="$PWD/build/preparation-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
          FLOTRA_UPGRADE_FIXTURES="$PWD/build/upgrade-fixtures" godot --headless --path flotra-campaign --script res://tests/release/upgrade_visibility.gd
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Test preparation, comparison, save and canceled input
        env:
          FLOTRA_PREPARATION_CASES: quickstart-${{ matrix.viewport }},fresh-${{ matrix.viewport }},mature-${{ matrix.viewport }}
          FLOTRA_UPGRADE_VIEWPORTS: ${{ matrix.viewport }}
        shell: bash
        run: |
          python3 -m http.server 8830 --bind 127.0.0.1 --directory docs/godot-jobs-preview > /tmp/flotra-preparation-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_preparation_journey.cjs http://127.0.0.1:8830/ build/preparation-browser-journey build/preparation-fixtures docs/godot-jobs-preview
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" xvfb-run -a node flotra-campaign/tests/release/browser_upgrade_visibility.cjs http://127.0.0.1:8830/ build/preparation-browser-journey/upgrade-visibility build/upgrade-fixtures docs/godot-jobs-preview
      - name: Preserve preparation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-preparation-browser-${{ matrix.viewport }}
          path: build/preparation-browser-journey
          retention-days: 7

  combined-renderer-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTROL_SHA: deaeb376c1265b0bb3ffe933ac1975f8db5f1048
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Prepare immutable public control and identical earned fixture
        run: |
          git fetch --no-tags --depth=1 origin "$CONTROL_SHA"
          mkdir -p build/pr154-control build/combined-fixtures build/combined-renderer
          git archive "$CONTROL_SHA" docs/godot-jobs-preview | tar -x -C build/pr154-control
          godot --headless --editor --path flotra-campaign --import
          FLOTRA_GROWTH_FIXTURES="$PWD/build/combined-fixtures" godot --headless --path flotra-campaign --script res://tests/release/growth_browser_fixtures.gd
      - name: Install one pinned browser for the fixed comparison
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare public and exact-head builds once in A-B-B-A order
        shell: bash
        run: |
          python3 -m http.server 8850 --bind 127.0.0.1 --directory build/pr154-control/docs/godot-jobs-preview > build/combined-renderer/control-server.log 2>&1 &
          control=$!
          python3 -m http.server 8851 --bind 127.0.0.1 --directory docs/godot-jobs-preview > build/combined-renderer/candidate-server.log 2>&1 &
          candidate=$!
          trap 'kill "$control" "$candidate" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules" node flotra-campaign/tests/release/browser_combined_performance.cjs http://127.0.0.1:8850/ http://127.0.0.1:8851/ build/combined-renderer build/combined-fixtures build/pr154-control/docs/godot-jobs-preview docs/godot-jobs-preview "$CONTROL_SHA" "$(git rev-parse HEAD)"
      - name: Preserve every control and candidate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotra-combined-renderer-control
          path: build/combined-renderer
          retention-days: 7

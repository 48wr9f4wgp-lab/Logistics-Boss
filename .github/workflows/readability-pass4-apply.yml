name: Apply Readability Pass 4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Readability Pass 4
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/readability-pass4.py
          python /tmp/readability-pass4.py
      - name: Verify syntax and patch
        shell: bash
        run: |
          node --check docs/src/scene.js
          node --check docs/src/ui.js
          grep -q 'readabilityPass = 4' docs/src/scene.js
          grep -q 'Readability pass 4 contract' .github/workflows/qa.yml
      - name: Commit Readability Pass 4
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply Readability Pass 4'
          git push

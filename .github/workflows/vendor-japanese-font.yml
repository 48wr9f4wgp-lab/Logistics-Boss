name: Vendor Japanese UI Font

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-japanese-font.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-font:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Download pinned M PLUS 1p Regular and OFL license
        shell: bash
        run: |
          set -euo pipefail
          FONT_COMMIT='a24c920263576ec723d64c1b26f8afabb841601d'
          FONT_BLOB='e16cd93613c26bb9d66d2060d6fd491c7222689f'
          LICENSE_BLOB='c173f0d8c43767c1e65b336d46a95c27b61bde92'

          mkdir -p godot/assets/fonts
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/${FONT_COMMIT}/ofl/mplus1p/MPLUS1p-Regular.ttf" \
            -o godot/assets/fonts/MPLUS1p-Regular.ttf
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/${FONT_COMMIT}/ofl/mplus1p/OFL.txt" \
            -o godot/assets/fonts/OFL-MPLUS1p.txt

          test "$(git hash-object godot/assets/fonts/MPLUS1p-Regular.ttf)" = "$FONT_BLOB"
          test "$(git hash-object godot/assets/fonts/OFL-MPLUS1p.txt)" = "$LICENSE_BLOB"

      - name: Commit vendored font assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/assets/fonts/MPLUS1p-Regular.ttf godot/assets/fonts/OFL-MPLUS1p.txt

          if git diff --cached --quiet; then
            echo "Japanese font assets already vendored."
            exit 0
          fi

          git commit -m "Vendor Japanese UI font"
          git push origin HEAD:main

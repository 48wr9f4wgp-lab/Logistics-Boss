name: Apply Rank 2 Systems Pass 1

on:
  push:
    branches: [rank2-systems-pass-1]
    paths:
      - '.github/rank2-systems-pass1-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Rank 2 systems patch
        run: python tools/rank2_systems_patch.py

      - name: Verify syntax and simulation smoke
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/src/sim.js
          node --check docs/src/ui.js
          node --check docs/src/scene.js
          node --check docs/tests/progression-smoke.mjs
          node docs/tests/progression-smoke.mjs
          grep -Fq 'data-staffing-plan="receiving"' docs/index.html
          grep -Fq 'data-facility="bufferYard"' docs/index.html
          grep -Fq 'data-facility="fastPackCell"' docs/index.html
          ! grep -Fq 'data-priority-kind=' docs/index.html
          ! grep -Fq 'data-upgrade=' docs/index.html
          grep -Fq 'schema_version: 3' docs/src/sim.js
          grep -Fq 'Rank 2 Systems Pass Phase 1 LOCK' GDD_LOGISTICS_BOSS.md

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/rank2_systems_patch.py .github/rank2-systems-pass1-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs GDD_LOGISTICS_BOSS.md RANK2_SYSTEMS_PASS_PLAN.md tools .github/rank2-systems-pass1-trigger.txt
          git commit -m 'Replace Rank 2 button spam with logistics systems'
          git push origin HEAD:rank2-systems-pass-1

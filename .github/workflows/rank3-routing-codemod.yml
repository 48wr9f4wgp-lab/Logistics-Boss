name: One-shot Rank 3 routing codemod

on:
  push:
    branches: [feature/rank3-carrier-routing]
    paths:
      - '.rank3-routing-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rank3-carrier-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded Routing Hub scene codemod
        run: node scripts/patch-routing-visual.mjs
      - name: Validate patched scene
        run: |
          node --check docs/src/scene.js
          node --check docs/src/routing-visual.js
          git diff --check
      - name: Commit patched scene
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/src/scene.js
          git diff --cached --quiet && exit 1
          git commit -m "Integrate event-driven Rank 3 Routing Hub visuals"
          git push origin HEAD:feature/rank3-carrier-routing

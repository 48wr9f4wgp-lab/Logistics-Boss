name: Capital v2 Phase 3 apply

on:
  push:
    branches: [feature/capital-v2-truck-waves]
    paths:
      - tools/capital_v3_patch.py
      - .github/workflows/capital-v3-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capital-v2-truck-waves
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair generated patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/capital_v3_patch.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('echo "JavaScript syntax OK""""', 'echo "JavaScript syntax OK"\n"""')
          s = s.replace('echo "Capital Expansion v2 contract OK""""', 'echo "Capital Expansion v2 contract OK"\n"""')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile tools/capital_v3_patch.py
      - name: Apply Phase 3 patch
        run: python tools/capital_v3_patch.py
      - name: Preflight syntax and smoke
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/src/*.js; do node --check "$file"; done
          node --check docs/tests/capital-v3-smoke.mjs
          node docs/tests/capital-v2-smoke.mjs
          node docs/tests/capital-v3-smoke.mjs
      - name: Keep generated commit workflow-free
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/qa.yml
          git checkout -- tools/capital_v3_patch.py
          rm -rf tools/__pycache__
      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CAPITAL_EXPANSION_V2.md docs/src/capital-model.js docs/src/capital.js docs/src/sim.js docs/src/scene.js docs/tests/capital-v3-smoke.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "Implement Capital v2 Phase 3 truck waves"
          git push origin HEAD:feature/capital-v2-truck-waves

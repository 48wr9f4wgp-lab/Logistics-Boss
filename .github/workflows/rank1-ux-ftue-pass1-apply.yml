name: Apply Rank 1 UX FTUE Pass 1

on:
  push:
    branches: [rank1-ux-ftue-pass-1]
    paths:
      - '.github/rank1-ux-ftue-pass1-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UX and FTUE pass
        run: python tools/rank1_ux_ftue_patch.py

      - name: Verify syntax and UX contract
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/src/ui.js
          grep -Fq 'STEP 1/3' docs/src/ui.js
          grep -Fq 'id="directorAction"' docs/index.html
          grep -Fq '棚使用' docs/index.html
          ! grep -Fq "celebrate('MILESTONE'" docs/src/ui.js

      - name: Commit Rank 1 UX FTUE pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/ux.css docs/src/ui.js GDD_LOGISTICS_BOSS.md
          git commit -m 'Improve Rank 1 UX and FTUE'
          git push origin HEAD:rank1-ux-ftue-pass-1

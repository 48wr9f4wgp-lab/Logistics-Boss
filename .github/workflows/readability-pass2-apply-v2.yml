name: Apply Readability Pass 2 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readability-pass2-apply-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dollhouse readability patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/src/scene.js')
          source = path.read_text()

          shell = '''function createWarehouseShell() {
            const group = new THREE.Group();
            const steel = 0x344049;
            const lightSteel = 0x4b5964;

            // Dollhouse shell: keep structure on the far/rear edges so the playable floor stays readable.
            for (const x of [-8.4, -4.2, 0, 4.2, 8.4]) {
              addBox(group, 0.16, 3.7, 0.16, x, 1.85, -7.2, steel, 0.58, 0, 0.42);
              addBox(group, 0.11, 0.11, 3.8, x, 3.5, -5.3, lightSteel, 0.6, 0, 0.34);
            }
            for (const z of [4.8, 0.8, -3.2]) {
              addBox(group, 0.14, 3.45, 0.14, -8.4, 1.725, z, steel, 0.58, 0, 0.42);
            }
            addBox(group, 17.0, 0.1, 0.1, 0, 3.3, -6.8, lightSteel, 0.6, 0, 0.34);
            addBox(group, 0.11, 0.11, 13.0, -8.4, 3.32, -0.55, lightSteel, 0.6, 0, 0.34);

            // Rear-biased fixtures keep atmosphere without bright bars crossing workers.
            for (let x = -6.4; x <= 6.4; x += 3.2) {
              const light = addBox(group, 1.0, 0.03, 0.06, x, 3.02, -4.55, 0xdaf6ff, 0.4, 0x9ee9ff);
              light.material.emissiveIntensity = 0.3;
            }
            group.userData.dollhouse = true;
            return group;
          }'''

          source, n = re.subn(
            r'function createWarehouseShell\(\) \{.*?\n\}\n\nfunction createFloorMarkings',
            shell + '\n\nfunction createFloorMarkings', source, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('warehouse shell patch failed')

          reset = '''  function resetCamera() {
            cameraState.yaw = 0.68;
            cameraState.pitch = 0.66;
            const growth = growthLevel();
            cameraState.targetDistance = 15.4 + growth * 2.2;
            cameraState.target.set(0, 0.52, -0.55 - growth * 1.15);
          }'''
          source, n = re.subn(
            r'  function resetCamera\(\) \{.*?\n  \}\n\n  function growthLevel',
            reset + '\n\n  function growthLevel', source, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('reset camera patch failed')

          replacements = [
            ("const cameraState = { yaw: 0.72, pitch: 0.76, distance: 16.2, targetDistance: 16.2, target: new THREE.Vector3(0, 0.32, -0.15) };",
             "const cameraState = { yaw: 0.68, pitch: 0.66, distance: 15.4, targetDistance: 15.4, target: new THREE.Vector3(0, 0.52, -0.55) };",
             'initial camera'),
            ("cameraState.targetDistance = Math.max(cameraState.targetDistance, 16.2 + growth * 2.3);",
             "cameraState.targetDistance = Math.max(cameraState.targetDistance, 15.4 + growth * 2.2);",
             'growth distance'),
            ("cameraState.target.z = -growth * 1.25;",
             "cameraState.target.z = -0.55 - growth * 1.15;",
             'growth target'),
            ("    let stableLines = 0;\n",
             "    let stableLines = 0;\n    let visibleLines = 0;\n",
             'flow counter'),
            ("      const show = flowMode && target && worker.task && (criticalTask(worker.task.kind) || (directorStable && stableLines < 2));",
             "      const relevant = criticalTask(worker.task?.kind) || (directorStable && stableLines < 2);\n      const show = flowMode && target && worker.task && relevant && visibleLines < 3;",
             'flow cap'),
            ("      if (show) {\n        if (directorStable) stableLines += 1;",
             "      if (show) {\n        visibleLines += 1;\n        if (directorStable) stableLines += 1;",
             'flow count increment'),
            ("new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.66, depthTest: false })",
             "new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, depthTest: false })",
             'flow opacity'),
          ]

          for old, new, label in replacements:
            if old not in source:
              raise SystemExit(f'{label} patch failed')
            source = source.replace(old, new, 1)

          path.write_text(source)
          for temp in [
            Path('.github/workflows/readability-pass2-apply.yml'),
            Path('.github/workflows/readability-pass2-apply-v2.yml'),
          ]:
            if temp.exists(): temp.unlink()
          PY

      - name: Verify JavaScript syntax and patch markers
        shell: bash
        run: |
          node --check docs/src/scene.js
          grep -q 'group.userData.dollhouse = true' docs/src/scene.js
          grep -q 'visibleLines < 3' docs/src/scene.js
          grep -q 'pitch: 0.66' docs/src/scene.js

      - name: Commit readability pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply dollhouse readability pass'
          git push

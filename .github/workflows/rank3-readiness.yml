name: Logistics Boss Rank 3 readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank3-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rank 3 contract-free readiness
        run: node docs/tests/rank3-readiness-smoke.mjs
      - name: Rank 3 real-simulation promotion and persistence
        run: node docs/tests/rank3-promotion-smoke.mjs
      - name: Rank 3 authoritative Carrier Routing
        run: node docs/tests/rank3-routing-smoke.mjs

name: Logistics Boss static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Required files
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/focus.css
          test -f docs/readability.css
          test -f docs/ux.css
          test -f docs/health.html
          test -f docs/.nojekyll
          test -f docs/src/main.js
          test -f docs/src/sim.js
          test -f docs/src/scene.js
          test -f docs/src/ui.js
          test -f docs/src/capital.js
          test -f docs/src/capital-model.js
          test -f docs/tests/progression-smoke.mjs
          test -f docs/tests/director-stability-smoke.mjs
          test -f docs/tests/capital-v2-smoke.mjs
          test -f GDD_LOGISTICS_BOSS.md
          test -f CAPITAL_EXPANSION_V1.md
          test -f CAPITAL_EXPANSION_V2.md
          test -f BENCHMARK_LOGISTICS_BOSS_2026-09-13.md
          test -f RANK2_SYSTEMS_PASS_PLAN.md
          echo "Required files OK"

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/src/*.js; do
            node --check "$file"
          done
          node --check docs/tests/progression-smoke.mjs
          node --check docs/tests/director-stability-smoke.mjs
          node --check docs/tests/capital-v2-smoke.mjs
          echo "JavaScript syntax OK"

      - name: Product identity contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<title>Logistics Boss</title>' docs/index.html
          grep -q "const SAVE_KEY = 'logistics_boss_save'" docs/src/main.js
          grep -q "localStorage.removeItem('logistics_boss_save')" docs/src/ui.js
          grep -q "from './scene.js'" docs/src/main.js
          grep -q "from './ui.js'" docs/src/main.js
          ! grep -R -n -E 'Observer Logistics|Workshop Sandbox|velvet' docs README.md GDD_LOGISTICS_BOSS.md || (echo 'Legacy product identity remains' && exit 1)
          echo "Product identity OK"

      - name: Static entry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q './styles.css' docs/index.html
          grep -q './focus.css' docs/index.html
          grep -q './readability.css' docs/index.html
          grep -q './ux.css' docs/index.html
          grep -q 'id="observeBtn"' docs/index.html
          grep -q 'id="focusExit"' docs/index.html
          grep -q './src/main.js' docs/index.html
          grep -q 'three@0.186.0' docs/src/scene.js
          grep -q 'rapier3d-compat@0.20.0' docs/src/scene.js
          echo "Static entry contract OK"

      - name: Readability pass 4 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'group.userData.readabilityPass = 4' docs/src/scene.js
          grep -Fq 'group.userData.flowArrows = []' docs/src/scene.js
          grep -Fq 'flowGuideClock' docs/src/scene.js
          grep -Fq 'updateFlowFloorGuide(dt)' docs/src/scene.js
          grep -Fq 'dataset.stable' docs/src/ui.js
          grep -Fq '#topHud .metric:nth-child(n+5)' docs/readability.css
          ! test -f .github/workflows/readability-pass4-apply.yml
          ! test -f .github/readability-pass4-trigger.txt
          echo "Readability pass 4 contract OK"

      - name: Progression Spine contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'schema_version: 3' docs/src/sim.js
          grep -q 'logisticsRating' docs/src/sim.js
          grep -q 'purchaseFacility' docs/src/sim.js
          grep -q 'packCapacity' docs/src/sim.js
          grep -q 'facilityProgressBar' docs/src/ui.js
          grep -q 'Progression Spine v1 — Phase 1 LOCK' GDD_LOGISTICS_BOSS.md
          node docs/tests/progression-smoke.mjs
          echo "Progression Spine contract OK"

      - name: Director stability regression
        shell: bash
        run: |
          set -euo pipefail
          ! test -f docs/src/insight-stability.js
          ! grep -Fq 'lastDirectorSeverity' docs/src/ui.js
          ! grep -Fq 'bindInsightStability' docs/src/main.js
          node docs/tests/director-stability-smoke.mjs
          echo "Director stability regression OK"

      - name: Rank 1 freedom UI contract
        shell: bash
        run: |
          set -euo pipefail
          ! test -f docs/src/ftue2.js
          ! grep -Fq './src/ftue2.js' docs/index.html
          ! grep -Fq 'id="directorAction"' docs/index.html
          ! grep -Fq 'id="ftueStep"' docs/index.html
          ! grep -Fq 'STEP 1/3' docs/src/ui.js
          ! grep -Fq 'directorAction.dataset.action' docs/src/ui.js
          ! grep -Fq 'MutationObserver' docs/src/ui.js
          grep -Fq '任意契約' docs/index.html
          grep -Fq '運営方針は自由' docs/src/ui.js
          grep -Fq '分析:' docs/src/ui.js
          grep -Fq 'Warehouse評価' docs/src/ui.js
          echo "Rank 1 freedom UI contract OK"

      - name: Rank 2 systems contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "staffingPlan: 'balanced'" docs/src/sim.js
          grep -Fq 'setStaffingPlan' docs/src/sim.js
          grep -Fq 'option.kind === worker.role' docs/src/sim.js
          grep -Fq "group: 'intakeStrategy'" docs/src/sim.js
          grep -Fq "group: 'rackStrategy'" docs/src/sim.js
          grep -Fq "group: 'packStrategy'" docs/src/sim.js
          grep -Fq 'data-staffing-plan="receiving"' docs/index.html
          grep -Fq 'data-staffing-plan="shipping"' docs/index.html
          grep -Fq 'data-facility="bufferYard"' docs/index.html
          grep -Fq 'data-facility="fastPackCell"' docs/index.html
          ! grep -Fq 'data-priority-kind=' docs/index.html
          ! grep -Fq 'data-upgrade=' docs/index.html
          grep -Fq 'bufferYardFacility.visible' docs/src/scene.js
          grep -Fq 'fastPackCellFacility.visible' docs/src/scene.js
          grep -Fq '拡張区画 ${chosenZones} / 3' docs/src/ui.js
          grep -Fq 'Rank 2 Systems Pass Phase 1 LOCK' GDD_LOGISTICS_BOSS.md
          ! test -f .github/workflows/rank2-systems-pass1-apply.yml
          ! test -f .github/rank2-systems-pass1-trigger.txt
          ! test -f tools/rank2_systems_patch.py
          echo "Rank 2 systems contract OK"

      - name: Rank 2 Systems Pass 2 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id="opsMiniSummary"' docs/index.html
          grep -Fq 'data-staffing-plan="picking"' docs/index.html
          grep -Fq 'data-staffing-plan="dock"' docs/index.html
          grep -Fq 'id="facilityImpact"' docs/index.html
          grep -Fq 'Fulfillment Center' docs/index.html
          grep -Fq 'function fulfillmentReadiness()' docs/src/sim.js
          grep -Fq 'function decisionImpact()' docs/src/sim.js
          grep -Fq 'decisionImpact = { type' docs/src/sim.js
          grep -Fq 'opsCrew' docs/src/ui.js
          grep -Fq 'nextStageBar' docs/src/ui.js
          grep -Fq 'Rank 2 Systems Pass — Phase 2 LOCK' GDD_LOGISTICS_BOSS.md
          node docs/tests/progression-smoke.mjs
          ! test -f .github/workflows/rank2-systems-pass2-apply.yml
          ! test -f .github/rank2-systems-pass2-trigger.txt
          ! test -f .github/rank2-systems-pass2-trigger-v2.txt
          ! test -f .github/rank2-systems-pass2-trigger-v3.txt
          ! test -f .github/rank2-systems-pass2-trigger-v4.txt
          ! test -f tools/rank2_systems_pass2_patch.py
          echo "Rank 2 Systems Pass 2 contract OK"

      - name: Capital Expansion v2 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'forklift:' docs/src/capital-model.js
          grep -Fq 'agv:' docs/src/capital-model.js
          grep -Fq 'sorter:' docs/src/capital-model.js
          grep -Fq 'function runForklift(dt)' docs/src/sim.js
          grep -Fq 'function runAgv(dt)' docs/src/sim.js
          grep -Fq 'function runSorter(dt)' docs/src/sim.js
          grep -Fq 'function purchaseCapitalUpgrade' docs/src/sim.js
          grep -Fq 'function forkliftUnit(index)' docs/src/scene.js
          grep -Fq 'function agvUnit(index)' docs/src/scene.js
          grep -Fq 'function sorterModule(index)' docs/src/scene.js
          grep -Fq "sim.purchaseCapitalUpgrade(def.upgrade, cost)" docs/src/capital.js
          ! grep -Fq 'sim.state.money -= cost' docs/src/capital.js
          node docs/tests/capital-v2-smoke.mjs
          echo "Capital Expansion v2 contract OK"

name: FLOTRA Navigation Capture Only
on:
  push:
    branches: ['diag/flotra-navigation-space-20261008-0647']
permissions:
  contents: read
jobs:
  navigation-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Set disposable browser directory
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/navigation-browsers" >> "$GITHUB_ENV"
      - name: Install pinned disposable browser
        run: |
          npm install --prefix "$RUNNER_TEMP/flotra-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/flotra-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check frozen source and prepare isolated profile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/navigation_capture_evidence.py verify
          mkdir -p "$RUNNER_TEMP/navigation-profile/data/godot"
          cp -a "$HOME/.local/share/godot/export_templates" "$RUNNER_TEMP/navigation-profile/data/godot/"
          echo "NAVIGATION_CAPTURE_HEAD $(git rev-parse HEAD)"
          godot --version
      - name: Capture corrected candidate core review
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/navigation-profile/home"
          export XDG_DATA_HOME="$RUNNER_TEMP/navigation-profile/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/navigation-profile/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/navigation-profile/cache"
          export FLOTRA_REVIEW_USER_ROOT="$RUNNER_TEMP/navigation-profile/"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$RUNNER_TEMP/navigation-evidence"
          export GODOT="$(command -v godot)"
          export NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules"
          trap 'python3 scripts/navigation_capture_evidence.py report "$RUNNER_TEMP/navigation-evidence"' EXIT
          bash scripts/run_navigation_candidate_capture.sh "$RUNNER_TEMP/navigation-evidence" 2>&1 | tee "$RUNNER_TEMP/navigation-evidence/capture.log"
      - name: Publish first desktop and phone core pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-core-pixels
          path: |
            ${{ runner.temp }}/navigation-evidence/candidate/*.jpg
            ${{ runner.temp }}/navigation-evidence/candidate/navigation-space.json
            ${{ runner.temp }}/navigation-evidence/baseline-reuse.json
          if-no-files-found: error
          retention-days: 7
      - name: Capture actual running and paused headers
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/flotra-browser/node_modules"
          out="$RUNNER_TEMP/navigation-evidence"
          python3 -m http.server 8816 --bind 127.0.0.1 --directory "$out/exports" > "$out/header-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; python3 scripts/navigation_capture_evidence.py report "$RUNNER_TEMP/navigation-evidence"' EXIT
          node scripts/navigation_header_capture.cjs http://127.0.0.1:8816/candidate/ "$out/headers" "$out/fixtures" 2>&1 | tee "$out/header-capture.log"
      - name: Prepare small review evidence even after failure
        if: always()
        shell: bash
        run: python3 scripts/navigation_capture_evidence.py package "$RUNNER_TEMP/navigation-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-review-small
          path: ${{ runner.temp }}/navigation-evidence/review/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-heavy-evidence
          path: |
            ${{ runner.temp }}/navigation-evidence/**
            !${{ runner.temp }}/navigation-evidence/review/**
          if-no-files-found: error
          retention-days: 7

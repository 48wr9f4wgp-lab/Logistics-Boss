name: FLOTRA One-Time Growth Source Integration

on:
  push:
    branches: [feat/growth-first-slice]
    paths:
      - '.github/workflows/growth-source-sync.yml'

permissions:
  contents: write

concurrency:
  group: flotra-growth-source-integration
  cancel-in-progress: false

jobs:
  integrate-local-text:
    if: github.ref == 'refs/heads/feat/growth-first-slice'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source bytes and stage only ordinary source files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/growth-first-slice'
          git merge-base --is-ancestor 4a2e3057a9ec34ce292be24921430593c062c5a8 HEAD
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, json, os
          hashes = [
              '9ba40e6bd9c579571dfff6be817f1e24e306c9221a0eaa46fc91d6849b67939e',
              'ef40fe558db5a028f832cfe2c5190c8bd4140cf20ac47d5d616ce73384f2677a',
              'd7fd05f36e8d98fbe9d8e0f5a50359db67f61149597fd4ae7c0406a1231877cf',
              '1664360587dd182a311a75bf0c3ad71ccd4eb8209d17c0710e9c8edf3ef73b10',
              '4a986b2bfb5098645399e726a9f4e783aba8b04e06d10ff86fe675add3ebe79d',
              '371d019f0b30e6d67b51fc89c5980f8536eaa49526dc6a9d44640a65d6f8c24c',
          ]
          result = {}
          for index, expected in enumerate(hashes):
              payload = pathlib.Path(f'tools/growth-edits{index:02d}.txt')
              raw = payload.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == expected, f'transfer mismatch: {payload}'
              lines = iter(raw.decode('utf-8').splitlines(keepends=True))
              for header in lines:
                  marker, name, before_sha, after_sha = header.strip().split()
                  assert marker == 'FILE' and name not in result
                  path = pathlib.Path(name)
                  assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
                  assert (name.startswith(('godot/domain/', 'godot/ui/', 'godot/view/', 'godot/tests/')) and path.suffix == '.gd') or name in {'godot/main.gd', 'GDD_FLOTRA.md', 'GROWTH_FIRST_SLICE_CHANGE_PACKET.md', '.github/workflows/growth-slice.yml'}, name
                  old = path.read_bytes() if path.exists() else b''
                  if before_sha == '-':
                      assert not path.exists(), f'unexpected existing file: {name}'
                  else:
                      assert hashlib.sha256(old).hexdigest() == before_sha, f'base mismatch: {name}'
                  edits = []
                  for command in lines:
                      if command == 'END_FILE\n':
                          break
                      tag, start, end = command.strip().split()
                      assert tag == 'EDIT'
                      replacement = []
                      for line in lines:
                          if line == 'END_EDIT\n':
                              break
                          replacement.append(line)
                      edits.append((int(start), int(end), ''.join(replacement)))
                  original = old.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(edits):
                      assert 0 <= start <= end <= len(original)
                      original[start:end] = [replacement]
                  new = ''.join(original).encode('utf-8')
                  assert hashlib.sha256(new).hexdigest() == after_sha, f'output mismatch: {name}'
                  result[name] = new
          assert len(result) == 35, len(result)
          # The Actions token has contents permission, not workflows permission.
          # Do not edit or delete any workflow here. The authorized connector
          # will apply the already-verified workflow and remove this job later.
          result.pop('.github/workflows/growth-slice.yml')
          for name, data in result.items():
              pathlib.Path(name).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(name).write_bytes(data)
          state = json.loads(pathlib.Path('DEV_STATUS.json').read_text())
          state['status_label'] = 'PRE_GO_GROWTH_FIRST_SLICE_PR132_DEVELOPMENT'
          state['working_head'] = {'repo':'48wr9f4wgp-lab/Logistics-Boss', 'branch':'feat/growth-first-slice', 'commit_at_sync_input':os.environ['GITHUB_SHA'], 'validation_status':'PARTIAL', 'note':'Containing source integration advances this feature branch; resolve live head. Main and engineering preview are unchanged.'}
          state['growth_direction_review']['status'] = 'IMPLEMENTED_ON_PR132_LOCAL_PASS_REMOTE_CI_PENDING_NOT_DEPLOYED'
          state['growth_direction_review']['proposal_locator'] = 'GROWTH_FIRST_SLICE_CHANGE_PACKET.md'
          state['growth_direction_review']['next_design_task'] = 'Verify repository CI and actual-main captures, then request a scoped preview approval. User fun and physical iPhone checks remain pending.'
          state['growth_first_slice'] = {'pr':132, 'change_packet':'GROWTH_FIRST_SLICE_CHANGE_PACKET.md', 'implementation':'ordinary20_shipments_any2_projects_cash8000_gate_no_rating_contract_optional_extra_working_forklift_and_transfer_conveyor', 'save_schema':10, 'migration':'read1_to9_preserve_money_ownership_staffing_book_values_project_inflight_to_queues_partial_work_restarts', 'local_tests':'two_no_contract_1x_earned_money_routes_automation_expansion_under300s_conservation_engine_input_and_backup_recovery_PASS', 'repository_ci':'PENDING', 'human_iphone':'NOT_TESTED', 'fun':'NOT_PASSED', 'preview_approval':'NOT_REQUESTED_FOR_PR132', 'old_gate':'SUPERSEDED_ON_BRANCH_RATING8_ALL4_CASH10000_REMAINS_IN_DEPLOYED_PR130'}
          state['checks']['post_pr130_human_notification_clearance'] = 'PASS_IN_OBSERVED_VIDEO_INTERVALS_ONLY_NOT_EXHAUSTIVE_DEVICE_ACCEPTANCE'
          state['checks']['growth_automation_fun'] = 'PR132_GROWTH_IMPLEMENTED_HUMAN_FUN_NOT_YET_TESTED'
          state['vertical_slice_v2']['implementation_state'] = 'GROWTH_FIRST_PR132_BRANCH_IMPLEMENTED_REMOTE_VERIFICATION_PENDING'
          state['vertical_slice_v2']['next_step'] = 'VERIFY_PR132_GROWTH_BRANCH_THEN_SCOPED_PREVIEW_APPROVAL'
          state['next'] = 'Complete PR132 repository CI and actual-main review; request build-specific preview replacement approval. Do not repeat the resolved Management input/popup diagnosis or silently deploy schema10.'
          state['blocked'] = 'No source-implementation blocker. PR132 repository checks pending; native physical-device lane remains separately deferred for Mac/Xcode.'
          state['recovery_state']['pr132'] = 'OPEN_FEATURE_BRANCH_MAIN_AND_PREVIEW_UNCHANGED'
          state['recovery_state']['user_data_reset'] = 'NOT_PERFORMED'
          state['recovery_state']['save_schema_change'] = 'SCHEMA10_ON_PR132_ONLY_NOT_DEPLOYED_OLD_SCHEMA9_EXECUTABLE_CANNOT_READ_SCHEMA10'
          pathlib.Path('DEV_STATUS.json').write_text(json.dumps(state, ensure_ascii=False, indent=2)+'\n')
          subprocess.run(['git', 'add', '--', *result, 'DEV_STATUS.json'], check=True)
          scratch = [f'tools/growth-edits{i:02d}.txt' for i in range(6)] + ['tools/growth-sync.part00', 'tools/growth-sync.part01']
          subprocess.run(['git', 'rm', '--', *scratch], check=True)
          print('All 35 source outputs verified; 34 non-workflow files and development state staged. Workflow changes deliberately excluded.')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement hash-verified growth-first source and preserve separate deployment state'
          git push origin HEAD:refs/heads/feat/growth-first-slice

name: One-shot Rank 3 promotion codemod

on:
  push:
    branches: [feature/rank3-promotion]
    paths:
      - '.rank3-promotion-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rank3-promotion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded sim codemod
        run: node scripts/patch-rank3-promotion.mjs
      - name: Validate patched simulation
        run: |
          node --check docs/src/sim.js
          node --check docs/src/rank3-model.js
          git diff --check
      - name: Commit patched simulation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/src/sim.js
          git diff --cached --quiet && exit 1
          git commit -m "Integrate Rank 3 promotion into simulation domain"
          git push origin HEAD:feature/rank3-promotion

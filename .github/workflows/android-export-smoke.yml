name: Logistics Boss Android Export Smoke

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/android-export-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/android-export-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-export-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOGISTICS_BOSS_ANDROID_PACKAGE: com.example.logisticsbossci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.1/aapt"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Godot version
        run: godot --version

      - name: Validate synthetic Android identifier
        run: python3 godot/tools/native_release_inputs.py --platform android

      - name: Android preset generator self-test
        run: python3 godot/tools/prepare_android_export.py --self-test

      - name: Prepare ephemeral Android export preset
        working-directory: godot
        run: |
          python3 tools/prepare_android_export.py \
            --base export_presets.cfg \
            --output export_presets.cfg \
            --preset-name "Android CI APK" \
            --package-id "$LOGISTICS_BOSS_ANDROID_PACKAGE"
          grep -F 'platform="Android"' export_presets.cfg
          grep -F "package/unique_name=\"$LOGISTICS_BOSS_ANDROID_PACKAGE\"" export_presets.cfg

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Generate ephemeral debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/logistics-boss-ci-debug.keystore"
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Logistics Boss CI,C=US"
          test -s "$KEYSTORE"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Parse/import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --editor --quit 2>&1 | tee /tmp/android-parse-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' /tmp/android-parse-import.log; then
            echo 'Godot parse/import emitted an engine/script error'
            exit 1
          fi

      - name: Export synthetic Android APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build
          mkdir -p android-build
          godot --headless --path godot --export-debug "Android CI APK" ../android-build/LogisticsBoss.apk 2>&1 | tee /tmp/android-export.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' /tmp/android-export.log; then
            echo 'Godot Android export emitted an engine/script error'
            exit 1
          fi
          test -s android-build/LogisticsBoss.apk

      - name: Validate APK payload and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android-build/LogisticsBoss.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/android-badging.txt
          grep -F "package: name='$LOGISTICS_BOSS_ANDROID_PACKAGE'" /tmp/android-badging.txt
          grep -F 'launchable-activity:' /tmp/android-badging.txt
          unzip -l "$APK" | tee /tmp/android-apk-files.txt
          grep -E 'lib/arm64-v8a/.+\.so' /tmp/android-apk-files.txt
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

      - name: Upload Android smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: logistics-boss-android-apk-smoke
          path: android-build/LogisticsBoss.apk
          if-no-files-found: error
          retention-days: 7

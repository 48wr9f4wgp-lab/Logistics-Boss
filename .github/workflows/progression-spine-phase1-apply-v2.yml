name: Apply Progression Spine v1 Phase 1 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/progression-spine-phase1-v2-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply progression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub1(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'patch failed: {label} ({n})')
              return out

          def rep1(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'patch failed: {label}')
              return text.replace(old, new, 1)

          # SIM
          p = Path('docs/src/sim.js')
          s = p.read_text()
          s = rep1(s, "const CONTRACT_KINDS = ['ship', 'inbound', 'throughput'];", """const FACILITY_INFO = {
            secondInbound: { label: '第2搬入口', cost: 2400, rank: 2, desc: '受入容量+6 / 入荷間隔を22%短縮' },
            fastPickRack: { label: '高速ピックラック', cost: 2800, rank: 2, group: 'rackStrategy', desc: '棚容量+4 / ピッキング移動+25%' },
            highDensityRack: { label: '高密度ラック', cost: 2800, rank: 2, group: 'rackStrategy', desc: '棚容量+12 / ピッキング移動-14%' },
            secondPack: { label: '第2梱包ライン', cost: 3200, rank: 2, desc: '同時梱包数 1→2' },
          };
          const FACILITY_RANKS = {
            1: { name: 'Small Depot', rating: 0 },
            2: { name: 'Warehouse', rating: 8 },
          };
          const CONTRACT_KINDS = ['ship', 'inbound', 'throughput'];""", 'constants')

          s = sub1(s,
              r"schema_version:\s*1,\n\s*money:\s*650,\n\s*research:\s*0,\n\s*shipped:\s*0,",
              """schema_version: 2,
              money: 650,
              research: 0,
              logisticsRating: 0,
              facilityRank: 1,
              facilities: { secondInbound: false, fastPickRack: false, highDensityRack: false, secondPack: false },
              shipped: 0,""", 'state')

          s = sub1(s,
              r"  function workerSpeed\(\) \{\n.*?\n  \}\n\n  function rackCapacity\(\) \{\n.*?\n  \}\n\n  function packTime\(\) \{",
              """  function workerSpeed() {
            return BASE.workerSpeed * (1 + state.upgrades.speed * 0.16);
          }

          function facilityRankName(rank = state.facilityRank) {
            return FACILITY_RANKS[rank]?.name || `Rank ${rank}`;
          }

          function nextRankTarget() {
            return state.facilityRank < 2 ? FACILITY_RANKS[2].rating : null;
          }

          function inboundMax() {
            return BASE.inboundMax + (state.facilities.secondInbound ? 6 : 0);
          }

          function inboundInterval() {
            return BASE.inboundInterval * (state.facilities.secondInbound ? 0.78 : 1);
          }

          function packCapacity() {
            return 1 + (state.facilities.secondPack ? 1 : 0);
          }

          function rackCapacity() {
            const strategyBonus = state.facilities.highDensityRack ? 12 : state.facilities.fastPickRack ? 4 : 0;
            return BASE.rackCapacity + state.upgrades.rack * 4 + strategyBonus;
          }

          function packTime() {""", 'helpers', re.S)

          s = rep1(s, 'if (current >= BASE.inboundMax) {', 'if (current >= inboundMax()) {', 'inbound max')
          s = rep1(s, "else if (box.phase === 'packing' || box.phase === 'carried_pick') packing += 1;", "else if (box.phase === 'waiting_pack' || box.phase === 'packing' || box.phase === 'carried_pick') packing += 1;", 'counts')
          s = rep1(s, "if (['carried_pick', 'packing', 'packed', 'carried_ship'].includes(box.phase)) total += 1;", "if (['carried_pick', 'waiting_pack', 'packing', 'packed', 'carried_ship'].includes(box.phase)) total += 1;", 'process orders')
          s = sub1(s,
              r"(\} else if \(kind === 'pick'\) \{\n\s*)box\.phase = 'packing';\n\s*box\.reservedBy = null;\n\s*box\.carrierId = null;\n\s*box\.packRemaining = packTime\(\);",
              r"\1box.phase = 'waiting_pack';\n      box.reservedBy = null;\n      box.carrierId = null;\n      box.packRemaining = 0;", 'pick queue')

          s = rep1(s, '  function updateWorkers(dt) {\n    const speed = workerSpeed();', '  function updateWorkers(dt) {\n    const baseSpeed = workerSpeed();', 'base speed')
          s = rep1(s, 'moveToward(worker, home, speed * 0.35 * dt);', 'moveToward(worker, home, baseSpeed * 0.35 * dt);', 'idle speed')
          s = sub1(s,
              r"(const target = task\.stage === 'pickup' \? \{ x: box\.x, z: box\.z \} : dropPosition\(task\);\n\s*)const oldX = worker\.x;\n\s*const oldZ = worker\.z;\n\s*const arrived = moveToward\(worker, target, speed \* dt\);",
              r"\1let taskSpeed = baseSpeed;\n      if (task.kind === 'pick' && state.facilities.fastPickRack) taskSpeed *= 1.25;\n      if (task.kind === 'pick' && state.facilities.highDensityRack) taskSpeed *= 0.86;\n      const oldX = worker.x;\n      const oldZ = worker.z;\n      const arrived = moveToward(worker, target, taskSpeed * dt);", 'pick speed')

          s = sub1(s, r"  function updatePacking\(dt\) \{.*?\n  \}\n\n  function runConveyor", """  function updatePacking(dt) {
            let active = state.boxes.filter((box) => box.phase === 'packing').length;
            if (active < packCapacity()) {
              for (const box of state.boxes) {
                if (box.phase !== 'waiting_pack') continue;
                box.phase = 'packing';
                box.packRemaining = packTime();
                active += 1;
                emit('packing_start', { boxId: box.id });
                if (active >= packCapacity()) break;
              }
            }
            for (const box of state.boxes) {
              if (box.phase !== 'packing') continue;
              box.packRemaining -= dt;
              if (box.packRemaining <= 0) {
                box.phase = 'packed';
                box.packRemaining = 0;
                emit('packed', { boxId: box.id, text: '梱包完了' });
              }
            }
            normalizePackedPositions();
          }

          function runConveyor""", 'packing queue', re.S)
          s = rep1(s, 'inboundTimer += BASE.inboundInterval;', 'inboundTimer += inboundInterval();', 'inbound interval')
          s = rep1(s, 'return { cash: Math.round(baseCash * mult), research: baseResearch };', 'return { cash: Math.round(baseCash * mult), research: baseResearch, rating: 2 };', 'rating reward')

          s = rep1(s, '  function finishContract(success) {', """  function updateFacilityRank() {
            if (state.facilityRank < 2 && state.logisticsRating >= FACILITY_RANKS[2].rating) {
              state.facilityRank = 2;
              emit('rank_up', { rank: 2, name: facilityRankName(2), text: '施設ランクUP: Warehouse' });
              markDirty();
            }
          }

          function finishContract(success) {""", 'rank helper')
          s = rep1(s, '      state.research += contract.reward.research;\n      state.completedContracts += 1;', '      state.research += contract.reward.research;\n      state.logisticsRating += contract.reward.rating || 2;\n      state.completedContracts += 1;\n      updateFacilityRank();', 'rating earn')
          s = rep1(s, 'text: `契約達成 +¥${contract.reward.cash} / 研究+${contract.reward.research}`,', 'text: `契約達成 +¥${contract.reward.cash} / 研究+${contract.reward.research} / 評価+${contract.reward.rating || 2}`,', 'contract text')
          s = rep1(s, 'inbound: c.inbound / BASE.inboundMax,', 'inbound: c.inbound / inboundMax(),', 'director ratio')
          s = rep1(s, "inbound: ['搬入口', '未処理の荷物が増えています', '入庫優先・スタッフ追加・自動搬送が有効'],", "inbound: ['搬入口', '未処理の荷物が増えています', '入庫優先・スタッフ追加・第2搬入口が有効'],", 'director text')
          s = rep1(s, "detail: '大きな詰まりはありません', recommendation: '次の契約と強化に備える', ratios,", "detail: '大きな詰まりはありません', recommendation: state.facilityRank < 2 ? '契約で物流評価を上げWarehouseを解禁する' : '設備投資で物流構造を進化させる', ratios,", 'stable advice')

          s = rep1(s, '  function purchasePerk(type) {', """  function facilityCost(type) {
            return FACILITY_INFO[type]?.cost ?? Infinity;
          }

          function purchaseFacility(type) {
            const def = FACILITY_INFO[type];
            if (!def) return { ok: false, reason: '不明な施設' };
            if (state.facilityRank < def.rank) return { ok: false, reason: `Rank ${def.rank}で解禁` };
            if (state.facilities[type]) return { ok: false, reason: '建設済み' };
            if (def.group === 'rackStrategy') {
              const other = type === 'fastPickRack' ? 'highDensityRack' : 'fastPickRack';
              if (state.facilities[other]) return { ok: false, reason: 'ラック方針は選択済み' };
            }
            const cost = facilityCost(type);
            if (state.money < cost) return { ok: false, reason: '資金不足' };
            state.money -= cost;
            state.facilities[type] = true;
            emit('facility_built', { type, text: `${def.label} 建設完了`, cost });
            markDirty();
            return { ok: true, cost, type };
          }

          function purchasePerk(type) {""", 'facility purchase')

          s = rep1(s, 'if (!snapshot || snapshot.schema_version !== 1) return;', 'if (!snapshot || ![1, 2].includes(snapshot.schema_version)) return;', 'hydrate schema')
          s = rep1(s, "    if (Number.isFinite(snapshot.milestoneAwarded)) state.milestoneAwarded = Math.max(0, Math.floor(snapshot.milestoneAwarded));\n    if (['balanced', 'inbound', 'ship'].includes(snapshot.policy)) state.policy = snapshot.policy;", """    if (Number.isFinite(snapshot.milestoneAwarded)) state.milestoneAwarded = Math.max(0, Math.floor(snapshot.milestoneAwarded));
            if (snapshot.schema_version === 2) {
              if (Number.isFinite(snapshot.logisticsRating)) state.logisticsRating = Math.max(0, Math.floor(snapshot.logisticsRating));
              if (Number.isFinite(snapshot.facilityRank)) state.facilityRank = clamp(Math.floor(snapshot.facilityRank), 1, 2);
              if (snapshot.facilities && typeof snapshot.facilities === 'object') {
                for (const key of Object.keys(FACILITY_INFO)) state.facilities[key] = Boolean(snapshot.facilities[key]);
              }
            } else {
              state.logisticsRating = Math.max(0, state.completedContracts * 2 + Math.floor(state.shipped / 100));
              state.facilityRank = state.logisticsRating >= FACILITY_RANKS[2].rating ? 2 : 1;
            }
            if (['balanced', 'inbound', 'ship'].includes(snapshot.policy)) state.policy = snapshot.policy;""", 'hydrate progression')

          s = sub1(s, r"schema_version:\s*1,\n\s*money:\s*state\.money,\n\s*research:\s*state\.research,\n\s*shipped:\s*state\.shipped,", """schema_version: 2,
              money: state.money,
              research: state.research,
              logisticsRating: state.logisticsRating,
              facilityRank: state.facilityRank,
              facilities: { ...state.facilities },
              shipped: state.shipped,""", 'serialize')

          s = rep1(s, '    state.money = 650;\n    state.research = 0;\n    state.shipped = 0;', """    state.money = 650;
            state.research = 0;
            state.logisticsRating = 0;
            state.facilityRank = 1;
            state.facilities = { secondInbound: false, fastPickRack: false, highDensityRack: false, secondPack: false };
            state.shipped = 0;""", 'reset')

          s = rep1(s, '    packTime,\n    conveyorInterval,\n    upgradeCost,\n    perkCost,\n    upgradeInfo: UPGRADE_INFO,', '    packTime,\n    packCapacity,\n    inboundMax,\n    conveyorInterval,\n    facilityRankName,\n    nextRankTarget,\n    facilityCost,\n    upgradeCost,\n    perkCost,\n    facilityInfo: FACILITY_INFO,\n    upgradeInfo: UPGRADE_INFO,', 'api helpers')
          s = rep1(s, '    purchaseUpgrade,\n    purchasePerk,', '    purchaseUpgrade,\n    purchaseFacility,\n    purchasePerk,', 'api purchase')
          p.write_text(s)

          # MAIN save migration
          p = Path('docs/src/main.js'); x = p.read_text()
          x = rep1(x, 'return parsed?.schema_version === 1 ? parsed : null;', 'return [1, 2].includes(parsed?.schema_version) ? parsed : null;', 'main schema')
          p.write_text(x)

          # INDEX
          p = Path('docs/index.html'); x = p.read_text()
          marker = '        <div class="sectionLabel">設備</div>\n        <div class="upgradeStrip" aria-label="設備強化">'
          block = '''        <div class="sectionLabel">施設成長</div>
          <div id="facilityProgress" class="facilityProgress" aria-label="施設ランク進行">
            <div class="facilityProgressHead"><strong id="facilityRank">RANK 1 · Small Depot</strong><span id="logisticsRating">物流評価 0 / 8</span></div>
            <div class="facilityProgressBar"><i id="facilityProgressBar"></i></div>
          </div>
          <div class="facilityStrip" aria-label="施設開発">
            <button class="facilityChoice" type="button" data-facility="secondInbound"><strong>第2搬入口</strong><span>受入容量を拡張</span><small data-facility-cost>¥2,400</small></button>
            <button class="facilityChoice" type="button" data-facility="fastPickRack"><strong>高速ピックラック</strong><span>高速回転型</span><small data-facility-cost>¥2,800</small></button>
            <button class="facilityChoice" type="button" data-facility="highDensityRack"><strong>高密度ラック</strong><span>大量保管型</span><small data-facility-cost>¥2,800</small></button>
            <button class="facilityChoice" type="button" data-facility="secondPack"><strong>第2梱包ライン</strong><span>同時梱包を2箱へ</span><small data-facility-cost>¥3,200</small></button>
          </div>

          <div class="sectionLabel">設備</div>
          <div class="upgradeStrip" aria-label="設備強化">'''
          x = rep1(x, marker, block, 'index facility')
          p.write_text(x)

          # UI
          p = Path('docs/src/ui.js'); x = p.read_text()
          x = rep1(x, "    research: document.getElementById('research'),", "    research: document.getElementById('research'),\n    facilityRank: document.getElementById('facilityRank'),\n    logisticsRating: document.getElementById('logisticsRating'),\n    facilityProgressBar: document.getElementById('facilityProgressBar'),", 'ui refs')
          x = rep1(x, "  const perkButtons = [...document.querySelectorAll('[data-perk]')];", "  const perkButtons = [...document.querySelectorAll('[data-perk]')];\n  const facilityButtons = [...document.querySelectorAll('[data-facility]')];", 'ui facility query')
          x = rep1(x, '  perkButtons.forEach((button) => {', """  facilityButtons.forEach((button) => {
            button.addEventListener('click', () => {
              const result = sim.purchaseFacility(button.dataset.facility);
              if (!result.ok) toast(result.reason, 'warn');
              else {
                toast(`施設建設 -${yen(result.cost)}`, 'good');
                try { navigator.vibrate?.([18, 25, 24]); } catch {}
                setDockCompact(true);
              }
              render();
            });
          });

          perkButtons.forEach((button) => {""", 'ui handlers')
          x = rep1(x, "const reward = event.reward ? `${yen(event.reward.cash)}  +${event.reward.research} RP` : event.text;", "const reward = event.reward ? `${yen(event.reward.cash)}  +${event.reward.research} RP  +${event.reward.rating || 2}評価` : event.text;", 'ui reward')
          x = rep1(x, "    } else if (event.type === 'milestone') {", "    } else if (event.type === 'rank_up') {\n      toast(event.text, 'good');\n      celebrate('FACILITY RANK UP', event.name);\n      setDockCompact(false);\n    } else if (event.type === 'facility_built') {\n      toast(event.text, 'good');\n    } else if (event.type === 'milestone') {", 'ui rank event')
          x = x.replace('<span>報酬 ${yen(active.reward.cash)} + ${active.reward.research}RP</span>', '<span>報酬 ${yen(active.reward.cash)} + ${active.reward.research}RP + ${active.reward.rating || 2}評価</span>')
          x = x.replace('<small>${yen(offer.reward.cash)} + ${offer.reward.research}RP</small>', '<small>${yen(offer.reward.cash)} + ${offer.reward.research}RP + ${offer.reward.rating || 2}評価</small>')
          x = rep1(x, "    el.research.textContent = `${s.research} RP`;\n    el.shipped.textContent = s.shipped.toLocaleString('ja-JP');", """    el.research.textContent = `${s.research} RP`;
            const nextTarget = sim.nextRankTarget();
            el.facilityRank.textContent = `RANK ${s.facilityRank} · ${sim.facilityRankName()}`;
            el.logisticsRating.textContent = nextTarget == null ? `物流評価 ${s.logisticsRating} · MAX` : `物流評価 ${s.logisticsRating} / ${nextTarget}`;
            el.facilityProgressBar.style.width = `${nextTarget == null ? 100 : Math.min(100, (s.logisticsRating / nextTarget) * 100)}%`;
            el.shipped.textContent = s.shipped.toLocaleString('ja-JP');""", 'ui progress render')
          x = rep1(x, '    upgradeButtons.forEach((button) => {', """    facilityButtons.forEach((button) => {
              const type = button.dataset.facility;
              const def = sim.facilityInfo[type];
              const built = Boolean(s.facilities[type]);
              const locked = s.facilityRank < def.rank;
              const conflicting = def.group === 'rackStrategy' && !built && (s.facilities.fastPickRack || s.facilities.highDensityRack);
              const costNode = button.querySelector('[data-facility-cost]');
              button.classList.toggle('built', built);
              button.classList.toggle('locked', locked);
              button.disabled = built || locked || conflicting || (!built && s.money < def.cost);
              if (costNode) costNode.textContent = built ? '建設済み' : locked ? `RANK ${def.rank}` : conflicting ? '方針選択済み' : yen(def.cost);
              button.title = def.desc;
            });

            upgradeButtons.forEach((button) => {""", 'ui facility render')
          p.write_text(x)

          # SCENE
          p = Path('docs/src/scene.js'); x = p.read_text()
          marker = '  scene.add(inbound, pack, outbound);\n\n  const rackBanks = [rackBank(-2.15, -1.65)];'
          block = '''  scene.add(inbound, pack, outbound);

          const secondInboundFacility = loadingDock({ x: -4.25, z: 4.25 });
          secondInboundFacility.scale.setScalar(0.82);
          secondInboundFacility.visible = false;
          scene.add(secondInboundFacility);
          const secondPackFacility = packStation({ x: 4.15, z: 1.45 });
          secondPackFacility.scale.setScalar(0.82);
          secondPackFacility.visible = false;
          scene.add(secondPackFacility);
          const fastPickRackFacility = rackBank(-2.15, -0.35, 0x65d8b4);
          fastPickRackFacility.scale.setScalar(0.9);
          fastPickRackFacility.visible = false;
          scene.add(fastPickRackFacility);
          const highDensityRackFacility = rackBank(-2.15, -3.7, 0xc783d9);
          highDensityRackFacility.scale.setScalar(0.96);
          highDensityRackFacility.visible = false;
          scene.add(highDensityRackFacility);

          const rackBanks = [rackBank(-2.15, -1.65)];'''
          x = rep1(x, marker, block, 'scene facility add')
          x = rep1(x, '  function updateGrowth(dt) {\n    const u = sim.state.upgrades;\n    rackBanks.forEach((b, i) => { b.visible = i === 0 || i <= u.rack; });', """  function updateGrowth(dt) {
            const u = sim.state.upgrades;
            const facilities = sim.state.facilities || {};
            secondInboundFacility.visible = Boolean(facilities.secondInbound);
            secondPackFacility.visible = Boolean(facilities.secondPack);
            fastPickRackFacility.visible = Boolean(facilities.fastPickRack);
            highDensityRackFacility.visible = Boolean(facilities.highDensityRack);
            rackBanks.forEach((b, i) => { b.visible = i === 0 || i <= u.rack; });""", 'scene visibility')
          p.write_text(x)

          # CSS
          p = Path('docs/styles.css'); x = p.read_text()
          marker = '.upgradeStrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none;touch-action:pan-x}'
          addon = marker + '''
          .facilityProgress{padding:7px 8px;border-radius:11px;background:rgba(80,156,210,.08);border:1px solid rgba(101,211,255,.16)}.facilityProgressHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.facilityProgressHead strong{font-size:11px;color:#d8f3ff}.facilityProgressHead span{font-size:9px;color:#9fb0bd;white-space:nowrap}.facilityProgressBar{height:5px;margin-top:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.facilityProgressBar i{display:block;width:0;height:100%;border-radius:inherit;background:#63cfff;box-shadow:0 0 12px rgba(99,207,255,.35);transition:width .22s ease}.facilityStrip{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:1px;scrollbar-width:none;touch-action:pan-x}.facilityStrip::-webkit-scrollbar{display:none}.facilityChoice{flex:0 0 132px;min-height:64px;padding:7px 8px;text-align:left;border:1px solid rgba(99,207,255,.18);border-radius:11px;background:rgba(52,115,151,.08);color:#f2f7fa}.facilityChoice strong{display:block;font-size:10px}.facilityChoice span{display:block;margin-top:3px;font-size:9px;color:#93a6b4;line-height:1.22}.facilityChoice small{display:block;margin-top:6px;font-size:9px;font-weight:900;color:#9ee9ff}.facilityChoice.built{border-color:rgba(94,224,160,.34);background:rgba(57,161,107,.12)}.facilityChoice.built small{color:#b7f2ce}.facilityChoice.locked{opacity:.48}.facilityChoice:disabled{filter:saturate(.72)}'''
          x = rep1(x, marker, addon, 'styles')
          p.write_text(x)

          # GDD
          p = Path('GDD_LOGISTICS_BOSS.md'); x = p.read_text()
          if '## Progression Spine v1 — Phase 1 LOCK' not in x:
              x += '''

          ## Progression Spine v1 — Phase 1 LOCK

          Core meta loop: **contract → cash/RP/logistics rating → facility rank → structural investment → new bottleneck → new directive**.

          - Cash builds structural facilities and secondary numeric upgrades.
          - RP buys research/perks.
          - Logistics Rating is non-spend progression from contracts.
          - Rank 1 Small Depot → Rank 2 Warehouse at Logistics Rating 8.
          - Rank 2: Second Inbound ¥2,400; one rack strategy (Fast Pick or High Density) ¥2,800; Second Pack Line ¥3,200.
          - Every structural investment changes both simulation behavior and visible 3D geometry.
          - Free-placement building remains out of scope.
          '''
          p.write_text(x)
          PY

      - name: Verify progression runtime
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/src/*.js; do node --check "$file"; done
          grep -q 'schema_version: 2' docs/src/sim.js
          grep -q 'purchaseFacility' docs/src/sim.js
          grep -q 'data-facility="secondInbound"' docs/index.html
          grep -q 'secondInboundFacility.visible' docs/src/scene.js
          node --input-type=module <<'NODE'
          import { createSimulation } from './docs/src/sim.js';
          const fresh = createSimulation(null);
          if (fresh.state.schema_version !== 2 || fresh.state.facilityRank !== 1) throw new Error('fresh state failed');
          if (fresh.purchaseFacility('secondInbound').ok) throw new Error('rank gate failed');
          const migrated = createSimulation({ schema_version: 1, money: 10000, research: 0, shipped: 0, completedContracts: 4, milestoneAwarded: 0, policy: 'balanced', priorities: {store:3,pick:3,ship:4}, upgrades: {}, perks: {} });
          if (migrated.state.facilityRank !== 2 || migrated.state.logisticsRating !== 8) throw new Error('migration failed');
          migrated.state.money = 10000;
          if (!migrated.purchaseFacility('fastPickRack').ok) throw new Error('fast rack failed');
          if (migrated.purchaseFacility('highDensityRack').ok) throw new Error('rack exclusivity failed');
          if (!migrated.purchaseFacility('secondPack').ok || migrated.packCapacity() !== 2) throw new Error('second pack failed');
          console.log('Progression Spine Phase 1 smoke OK');
          NODE


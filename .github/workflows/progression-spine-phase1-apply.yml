name: Apply Progression Spine v1 Phase 1

on:
  push:
    branches: [main]
    paths:
      - '.github/progression-spine-phase1-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Progression Spine v1 Phase 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # --- simulation / progression ---
          path = Path('docs/src/sim.js')
          s = path.read_text()

          anchor = "const CONTRACT_KINDS = ['ship', 'inbound', 'throughput'];"
          insert = """const FACILITY_INFO = {
            secondInbound: { label: '第2搬入口', cost: 2400, rank: 2, desc: '受入容量+6 / 入荷間隔を22%短縮' },
            fastPickRack: { label: '高速ピックラック', cost: 2800, rank: 2, group: 'rackStrategy', desc: '棚容量+4 / ピッキング移動+25%' },
            highDensityRack: { label: '高密度ラック', cost: 2800, rank: 2, group: 'rackStrategy', desc: '棚容量+12 / ピッキング移動-14%' },
            secondPack: { label: '第2梱包ライン', cost: 3200, rank: 2, desc: '同時梱包数 1→2' },
          };

          const FACILITY_RANKS = {
            1: { name: 'Small Depot', rating: 0 },
            2: { name: 'Warehouse', rating: 8 },
          };

          const CONTRACT_KINDS = ['ship', 'inbound', 'throughput'];"""
          s = replace_once(s, anchor, insert, 'facility constants')

          old = """    schema_version: 1,
            money: 650,
            research: 0,
            shipped: 0,"""
          new = """    schema_version: 2,
            money: 650,
            research: 0,
            logisticsRating: 0,
            facilityRank: 1,
            facilities: { secondInbound: false, fastPickRack: false, highDensityRack: false, secondPack: false },
            shipped: 0,"""
          s = replace_once(s, old, new, 'state progression fields')

          old = """  function workerSpeed() {
            return BASE.workerSpeed * (1 + state.upgrades.speed * 0.16);
          }

          function rackCapacity() {
            return BASE.rackCapacity + state.upgrades.rack * 4;
          }

          function packTime() {"""
          new = """  function workerSpeed() {
            return BASE.workerSpeed * (1 + state.upgrades.speed * 0.16);
          }

          function facilityRankName(rank = state.facilityRank) {
            return FACILITY_RANKS[rank]?.name || `Rank ${rank}`;
          }

          function nextRankTarget() {
            return state.facilityRank < 2 ? FACILITY_RANKS[2].rating : null;
          }

          function inboundMax() {
            return BASE.inboundMax + (state.facilities.secondInbound ? 6 : 0);
          }

          function inboundInterval() {
            return BASE.inboundInterval * (state.facilities.secondInbound ? 0.78 : 1);
          }

          function packCapacity() {
            return 1 + (state.facilities.secondPack ? 1 : 0);
          }

          function rackCapacity() {
            const strategyBonus = state.facilities.highDensityRack ? 12 : state.facilities.fastPickRack ? 4 : 0;
            return BASE.rackCapacity + state.upgrades.rack * 4 + strategyBonus;
          }

          function packTime() {"""
          s = replace_once(s, old, new, 'capacity helpers')

          s = replace_once(s, "if (current >= BASE.inboundMax) {", "if (current >= inboundMax()) {", 'inbound max spawn')
          s = replace_once(s, "else if (box.phase === 'packing' || box.phase === 'carried_pick') packing += 1;", "else if (box.phase === 'waiting_pack' || box.phase === 'packing' || box.phase === 'carried_pick') packing += 1;", 'packing counts')
          s = replace_once(s, "if (['carried_pick', 'packing', 'packed', 'carried_ship'].includes(box.phase)) total += 1;", "if (['carried_pick', 'waiting_pack', 'packing', 'packed', 'carried_ship'].includes(box.phase)) total += 1;", 'in process orders')

          s = replace_once(s, """    } else if (kind === 'pick') {
              box.phase = 'packing';
              box.reservedBy = null;
              box.carrierId = null;
              box.packRemaining = packTime();
              box.x = POS.pack.x;
              box.y = 0.35;
              box.z = POS.pack.z;""", """    } else if (kind === 'pick') {
              box.phase = 'waiting_pack';
              box.reservedBy = null;
              box.carrierId = null;
              box.packRemaining = 0;
              box.x = POS.pack.x;
              box.y = 0.35;
              box.z = POS.pack.z;""", 'pick waits for pack slot')

          s = replace_once(s, "  function updateWorkers(dt) {\n    const speed = workerSpeed();", "  function updateWorkers(dt) {\n    const baseSpeed = workerSpeed();", 'worker base speed')
          s = replace_once(s, "moveToward(worker, home, speed * 0.35 * dt);", "moveToward(worker, home, baseSpeed * 0.35 * dt);", 'idle worker speed')
          old = """      const target = task.stage === 'pickup' ? { x: box.x, z: box.z } : dropPosition(task);
              const oldX = worker.x;
              const oldZ = worker.z;
              const arrived = moveToward(worker, target, speed * dt);"""
          new = """      const target = task.stage === 'pickup' ? { x: box.x, z: box.z } : dropPosition(task);
              let taskSpeed = baseSpeed;
              if (task.kind === 'pick' && state.facilities.fastPickRack) taskSpeed *= 1.25;
              if (task.kind === 'pick' && state.facilities.highDensityRack) taskSpeed *= 0.86;
              const oldX = worker.x;
              const oldZ = worker.z;
              const arrived = moveToward(worker, target, taskSpeed * dt);"""
          s = replace_once(s, old, new, 'rack strategy movement')

          pattern = re.compile(r"  function updatePacking\(dt\) \{.*?\n  \}\n\n  function runConveyor", re.S)
          new_block = """  function updatePacking(dt) {
            let active = state.boxes.filter((box) => box.phase === 'packing').length;
            if (active < packCapacity()) {
              for (const box of state.boxes) {
                if (box.phase !== 'waiting_pack') continue;
                box.phase = 'packing';
                box.packRemaining = packTime();
                active += 1;
                emit('packing_start', { boxId: box.id });
                if (active >= packCapacity()) break;
              }
            }
            for (const box of state.boxes) {
              if (box.phase !== 'packing') continue;
              box.packRemaining -= dt;
              if (box.packRemaining <= 0) {
                box.phase = 'packed';
                box.packRemaining = 0;
                emit('packed', { boxId: box.id, text: '梱包完了' });
              }
            }
            normalizePackedPositions();
          }

          function runConveyor"""
          s, n = pattern.subn(new_block, s, count=1)
          if n != 1: raise SystemExit('updatePacking replacement failed')

          s = replace_once(s, "inboundTimer += BASE.inboundInterval;", "inboundTimer += inboundInterval();", 'dynamic inbound interval')

          old = """  function contractReward(baseCash, baseResearch = 1) {
            const mult = 1 + state.perks.contractBonus * 0.25;
            return { cash: Math.round(baseCash * mult), research: baseResearch };
          }"""
          new = """  function contractReward(baseCash, baseResearch = 1) {
            const mult = 1 + state.perks.contractBonus * 0.25;
            return { cash: Math.round(baseCash * mult), research: baseResearch, rating: 2 };
          }"""
          s = replace_once(s, old, new, 'contract rating reward')

          old = """  function finishContract(success) {
            const contract = state.activeContract;
            if (!contract) return;
            if (success) {
              state.money += contract.reward.cash;
              state.research += contract.reward.research;
              state.completedContracts += 1;
              emit('contract_complete', {
                text: `契約達成 +¥${contract.reward.cash} / 研究+${contract.reward.research}`,
                reward: contract.reward,
              });"""
          new = """  function updateFacilityRank() {
            if (state.facilityRank < 2 && state.logisticsRating >= FACILITY_RANKS[2].rating) {
              state.facilityRank = 2;
              emit('rank_up', { rank: 2, name: facilityRankName(2), text: '施設ランクUP: Warehouse' });
              markDirty();
            }
          }

          function finishContract(success) {
            const contract = state.activeContract;
            if (!contract) return;
            if (success) {
              state.money += contract.reward.cash;
              state.research += contract.reward.research;
              state.logisticsRating += contract.reward.rating || 2;
              state.completedContracts += 1;
              updateFacilityRank();
              emit('contract_complete', {
                text: `契約達成 +¥${contract.reward.cash} / 研究+${contract.reward.research} / 評価+${contract.reward.rating || 2}`,
                reward: contract.reward,
              });"""
          s = replace_once(s, old, new, 'rank and contract completion')

          s = replace_once(s, "inbound: c.inbound / BASE.inboundMax,", "inbound: c.inbound / inboundMax(),", 'director inbound capacity')
          s = replace_once(s, "inbound: ['搬入口', '未処理の荷物が増えています', '入庫優先・スタッフ追加・自動搬送が有効'],", "inbound: ['搬入口', '未処理の荷物が増えています', '入庫優先・スタッフ追加・第2搬入口が有効'],", 'director facility advice')
          s = replace_once(s, "detail: '大きな詰まりはありません', recommendation: '次の契約と強化に備える', ratios,", "detail: '大きな詰まりはありません', recommendation: state.facilityRank < 2 ? '契約で物流評価を上げWarehouseを解禁する' : '設備投資で物流構造を進化させる', ratios,", 'stable progression advice')

          old = """  function purchasePerk(type) {"""
          facility_fn = """  function facilityCost(type) {
            return FACILITY_INFO[type]?.cost ?? Infinity;
          }

          function purchaseFacility(type) {
            const def = FACILITY_INFO[type];
            if (!def) return { ok: false, reason: '不明な施設' };
            if (state.facilityRank < def.rank) return { ok: false, reason: `Rank ${def.rank}で解禁` };
            if (state.facilities[type]) return { ok: false, reason: '建設済み' };
            if (def.group === 'rackStrategy') {
              const other = type === 'fastPickRack' ? 'highDensityRack' : 'fastPickRack';
              if (state.facilities[other]) return { ok: false, reason: 'ラック方針は選択済み' };
            }
            const cost = facilityCost(type);
            if (state.money < cost) return { ok: false, reason: '資金不足' };
            state.money -= cost;
            state.facilities[type] = true;
            emit('facility_built', { type, text: `${def.label} 建設完了`, cost });
            markDirty();
            return { ok: true, cost, type };
          }

          function purchasePerk(type) {"""
          s = replace_once(s, old, facility_fn, 'facility purchase')

          old = """  function hydrate(snapshot) {
            if (!snapshot || snapshot.schema_version !== 1) return;
            if (Number.isFinite(snapshot.money)) state.money = Math.max(0, snapshot.money);"""
          new = """  function hydrate(snapshot) {
            if (!snapshot || ![1, 2].includes(snapshot.schema_version)) return;
            if (Number.isFinite(snapshot.money)) state.money = Math.max(0, snapshot.money);"""
          s = replace_once(s, old, new, 'schema migration entry')

          anchor = """    if (Number.isFinite(snapshot.milestoneAwarded)) state.milestoneAwarded = Math.max(0, Math.floor(snapshot.milestoneAwarded));
            if (['balanced', 'inbound', 'ship'].includes(snapshot.policy)) state.policy = snapshot.policy;"""
          insert = """    if (Number.isFinite(snapshot.milestoneAwarded)) state.milestoneAwarded = Math.max(0, Math.floor(snapshot.milestoneAwarded));
            if (snapshot.schema_version === 2) {
              if (Number.isFinite(snapshot.logisticsRating)) state.logisticsRating = Math.max(0, Math.floor(snapshot.logisticsRating));
              if (Number.isFinite(snapshot.facilityRank)) state.facilityRank = clamp(Math.floor(snapshot.facilityRank), 1, 2);
              if (snapshot.facilities && typeof snapshot.facilities === 'object') {
                for (const key of Object.keys(FACILITY_INFO)) state.facilities[key] = Boolean(snapshot.facilities[key]);
              }
            } else {
              state.logisticsRating = Math.max(0, state.completedContracts * 2 + Math.floor(state.shipped / 100));
              state.facilityRank = state.logisticsRating >= FACILITY_RANKS[2].rating ? 2 : 1;
            }
            if (['balanced', 'inbound', 'ship'].includes(snapshot.policy)) state.policy = snapshot.policy;"""
          s = replace_once(s, anchor, insert, 'schema migration fields')

          old = """      schema_version: 1,
              money: state.money,
              research: state.research,
              shipped: state.shipped,"""
          new = """      schema_version: 2,
              money: state.money,
              research: state.research,
              logisticsRating: state.logisticsRating,
              facilityRank: state.facilityRank,
              facilities: { ...state.facilities },
              shipped: state.shipped,"""
          s = replace_once(s, old, new, 'serialize progression')

          old = """    state.money = 650;
            state.research = 0;
            state.shipped = 0;"""
          new = """    state.money = 650;
            state.research = 0;
            state.logisticsRating = 0;
            state.facilityRank = 1;
            state.facilities = { secondInbound: false, fastPickRack: false, highDensityRack: false, secondPack: false };
            state.shipped = 0;"""
          s = replace_once(s, old, new, 'reset progression')

          old = """    rackCapacity,
            workerSpeed,
            packTime,
            conveyorInterval,
            upgradeCost,
            perkCost,
            upgradeInfo: UPGRADE_INFO,
            perkInfo: PERK_INFO,"""
          new = """    rackCapacity,
            workerSpeed,
            packTime,
            packCapacity,
            inboundMax,
            conveyorInterval,
            facilityRankName,
            nextRankTarget,
            facilityCost,
            upgradeCost,
            perkCost,
            facilityInfo: FACILITY_INFO,
            upgradeInfo: UPGRADE_INFO,
            perkInfo: PERK_INFO,"""
          s = replace_once(s, old, new, 'public progression api 1')
          s = replace_once(s, "    purchaseUpgrade,\n    purchasePerk,", "    purchaseUpgrade,\n    purchaseFacility,\n    purchasePerk,", 'public progression api 2')
          path.write_text(s)

          # --- save migration ---
          path = Path('docs/src/main.js')
          m = path.read_text()
          m = replace_once(m, "return parsed?.schema_version === 1 ? parsed : null;", "return [1, 2].includes(parsed?.schema_version) ? parsed : null;", 'main save schema')
          path.write_text(m)

          # --- management UI markup ---
          path = Path('docs/index.html')
          h = path.read_text()
          anchor = """        <div class=\"sectionLabel\">設備</div>
                <div class=\"upgradeStrip\" aria-label=\"設備強化\">"""
          block = """        <div class=\"sectionLabel\">施設成長</div>
                <div id=\"facilityProgress\" class=\"facilityProgress\" aria-label=\"施設ランク進行\">
                  <div class=\"facilityProgressHead\"><strong id=\"facilityRank\">RANK 1 · Small Depot</strong><span id=\"logisticsRating\">物流評価 0 / 8</span></div>
                  <div class=\"facilityProgressBar\"><i id=\"facilityProgressBar\"></i></div>
                </div>
                <div class=\"facilityStrip\" aria-label=\"施設開発\">
                  <button class=\"facilityChoice\" type=\"button\" data-facility=\"secondInbound\"><strong>第2搬入口</strong><span>受入容量を拡張</span><small data-facility-cost>¥2,400</small></button>
                  <button class=\"facilityChoice\" type=\"button\" data-facility=\"fastPickRack\"><strong>高速ピックラック</strong><span>高速回転型</span><small data-facility-cost>¥2,800</small></button>
                  <button class=\"facilityChoice\" type=\"button\" data-facility=\"highDensityRack\"><strong>高密度ラック</strong><span>大量保管型</span><small data-facility-cost>¥2,800</small></button>
                  <button class=\"facilityChoice\" type=\"button\" data-facility=\"secondPack\"><strong>第2梱包ライン</strong><span>同時梱包を2箱へ</span><small data-facility-cost>¥3,200</small></button>
                </div>

                <div class=\"sectionLabel\">設備</div>
                <div class=\"upgradeStrip\" aria-label=\"設備強化\">"""
          h = replace_once(h, anchor, block, 'facility UI markup')
          path.write_text(h)

          # --- UI behavior ---
          path = Path('docs/src/ui.js')
          u = path.read_text()
          u = replace_once(u, "    research: document.getElementById('research'),", "    research: document.getElementById('research'),\n    facilityRank: document.getElementById('facilityRank'),\n    logisticsRating: document.getElementById('logisticsRating'),\n    facilityProgressBar: document.getElementById('facilityProgressBar'),", 'ui refs')
          u = replace_once(u, "  const perkButtons = [...document.querySelectorAll('[data-perk]')];", "  const perkButtons = [...document.querySelectorAll('[data-perk]')];\n  const facilityButtons = [...document.querySelectorAll('[data-facility]')];", 'facility button query')
          anchor = """  perkButtons.forEach((button) => {
            button.addEventListener('click', () => {"""
          facility_handlers = """  facilityButtons.forEach((button) => {
            button.addEventListener('click', () => {
              const type = button.dataset.facility;
              const result = sim.purchaseFacility(type);
              if (!result.ok) toast(result.reason, 'warn');
              else {
                toast(`施設建設 -${yen(result.cost)}`, 'good');
                try { navigator.vibrate?.([18, 25, 24]); } catch {}
                setDockCompact(true);
              }
              render();
            });
          });

          perkButtons.forEach((button) => {
            button.addEventListener('click', () => {"""
          u = replace_once(u, anchor, facility_handlers, 'facility handlers')
          u = replace_once(u, "const reward = event.reward ? `${yen(event.reward.cash)}  +${event.reward.research} RP` : event.text;", "const reward = event.reward ? `${yen(event.reward.cash)}  +${event.reward.research} RP  +${event.reward.rating || 2}評価` : event.text;", 'contract celebration rating')
          u = replace_once(u, "    } else if (event.type === 'milestone') {", "    } else if (event.type === 'rank_up') {\n      toast(event.text, 'good');\n      celebrate('FACILITY RANK UP', event.name);\n      setDockCompact(false);\n    } else if (event.type === 'facility_built') {\n      toast(event.text, 'good');\n    } else if (event.type === 'milestone') {", 'rank events')
          u = u.replace("<span>報酬 ${yen(active.reward.cash)} + ${active.reward.research}RP</span>", "<span>報酬 ${yen(active.reward.cash)} + ${active.reward.research}RP + ${active.reward.rating || 2}評価</span>")
          u = u.replace("<small>${yen(offer.reward.cash)} + ${offer.reward.research}RP</small>", "<small>${yen(offer.reward.cash)} + ${offer.reward.research}RP + ${offer.reward.rating || 2}評価</small>")

          anchor = """    el.money.textContent = yen(s.money);
            el.research.textContent = `${s.research} RP`;
            el.shipped.textContent = s.shipped.toLocaleString('ja-JP');"""
          progress_render = """    el.money.textContent = yen(s.money);
            el.research.textContent = `${s.research} RP`;
            const nextTarget = sim.nextRankTarget();
            el.facilityRank.textContent = `RANK ${s.facilityRank} · ${sim.facilityRankName()}`;
            el.logisticsRating.textContent = nextTarget == null ? `物流評価 ${s.logisticsRating} · MAX` : `物流評価 ${s.logisticsRating} / ${nextTarget}`;
            const progress = nextTarget == null ? 100 : Math.min(100, (s.logisticsRating / nextTarget) * 100);
            el.facilityProgressBar.style.width = `${progress}%`;
            el.shipped.textContent = s.shipped.toLocaleString('ja-JP');"""
          u = replace_once(u, anchor, progress_render, 'progress render')

          anchor = """    upgradeButtons.forEach((button) => {
              const type = button.dataset.upgrade;"""
          facility_render = """    facilityButtons.forEach((button) => {
              const type = button.dataset.facility;
              const def = sim.facilityInfo[type];
              const built = Boolean(s.facilities[type]);
              const locked = s.facilityRank < def.rank;
              const conflicting = def.group === 'rackStrategy' && !built && (s.facilities.fastPickRack || s.facilities.highDensityRack);
              const costNode = button.querySelector('[data-facility-cost]');
              button.classList.toggle('built', built);
              button.classList.toggle('locked', locked);
              button.disabled = built || locked || conflicting || (!built && s.money < def.cost);
              if (costNode) costNode.textContent = built ? '建設済み' : locked ? `RANK ${def.rank}` : conflicting ? '方針選択済み' : yen(def.cost);
              button.title = def.desc;
            });

            upgradeButtons.forEach((button) => {
              const type = button.dataset.upgrade;"""
          u = replace_once(u, anchor, facility_render, 'facility render')
          path.write_text(u)

          # --- 3D facility state ---
          path = Path('docs/src/scene.js')
          sc = path.read_text()
          anchor = """  inbound.scale.setScalar(1.08);
            pack.scale.setScalar(1.12);
            outbound.scale.setScalar(1.08);
            scene.add(inbound, pack, outbound);

            const rackBanks = [rackBank(-2.15, -1.65)];"""
          block = """  inbound.scale.setScalar(1.08);
            pack.scale.setScalar(1.12);
            outbound.scale.setScalar(1.08);
            scene.add(inbound, pack, outbound);

            const secondInboundFacility = loadingDock({ x: -4.25, z: 4.25 });
            secondInboundFacility.scale.setScalar(0.82);
            secondInboundFacility.visible = false;
            scene.add(secondInboundFacility);
            const secondPackFacility = packStation({ x: 4.15, z: 1.45 });
            secondPackFacility.scale.setScalar(0.82);
            secondPackFacility.visible = false;
            scene.add(secondPackFacility);
            const fastPickRackFacility = rackBank(-2.15, -0.35, 0x65d8b4);
            fastPickRackFacility.scale.setScalar(0.9);
            fastPickRackFacility.visible = false;
            scene.add(fastPickRackFacility);
            const highDensityRackFacility = rackBank(-2.15, -3.7, 0xc783d9);
            highDensityRackFacility.scale.setScalar(0.96);
            highDensityRackFacility.visible = false;
            scene.add(highDensityRackFacility);

            const rackBanks = [rackBank(-2.15, -1.65)];"""
          sc = replace_once(sc, anchor, block, 'scene facilities')
          anchor = """  function updateGrowth(dt) {
            const u = sim.state.upgrades;
            rackBanks.forEach((b, i) => { b.visible = i === 0 || i <= u.rack; });"""
          new = """  function updateGrowth(dt) {
            const u = sim.state.upgrades;
            const facilities = sim.state.facilities || {};
            secondInboundFacility.visible = Boolean(facilities.secondInbound);
            secondPackFacility.visible = Boolean(facilities.secondPack);
            fastPickRackFacility.visible = Boolean(facilities.fastPickRack);
            highDensityRackFacility.visible = Boolean(facilities.highDensityRack);
            rackBanks.forEach((b, i) => { b.visible = i === 0 || i <= u.rack; });"""
          sc = replace_once(sc, anchor, new, 'scene facility visibility')
          path.write_text(sc)

          # --- styling ---
          path = Path('docs/styles.css')
          css = path.read_text()
          marker = '.upgradeStrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none;touch-action:pan-x}'
          addition = marker + """
          .facilityProgress{padding:7px 8px;border-radius:11px;background:rgba(80,156,210,.08);border:1px solid rgba(101,211,255,.16)}.facilityProgressHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.facilityProgressHead strong{font-size:11px;color:#d8f3ff}.facilityProgressHead span{font-size:9px;color:#9fb0bd;white-space:nowrap}.facilityProgressBar{height:5px;margin-top:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.facilityProgressBar i{display:block;width:0;height:100%;border-radius:inherit;background:#63cfff;box-shadow:0 0 12px rgba(99,207,255,.35);transition:width .22s ease}.facilityStrip{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:1px;scrollbar-width:none;touch-action:pan-x}.facilityStrip::-webkit-scrollbar{display:none}.facilityChoice{flex:0 0 132px;min-height:64px;padding:7px 8px;text-align:left;border:1px solid rgba(99,207,255,.18);border-radius:11px;background:rgba(52,115,151,.08);color:#f2f7fa}.facilityChoice strong{display:block;font-size:10px}.facilityChoice span{display:block;margin-top:3px;font-size:9px;color:#93a6b4;line-height:1.22}.facilityChoice small{display:block;margin-top:6px;font-size:9px;font-weight:900;color:#9ee9ff}.facilityChoice.built{border-color:rgba(94,224,160,.34);background:rgba(57,161,107,.12)}.facilityChoice.built small{color:#b7f2ce}.facilityChoice.locked{opacity:.48}.facilityChoice:disabled{filter:saturate(.72)}
          """
          css = replace_once(css, marker, addition, 'facility styles')
          path.write_text(css)

          # --- GDD lock ---
          path = Path('GDD_LOGISTICS_BOSS.md')
          gdd = path.read_text()
          if '## Progression Spine v1 — Phase 1 LOCK' not in gdd:
              gdd += """

          ## Progression Spine v1 — Phase 1 LOCK

          Progression goal: evolve the product from numeric upgrades into visible logistics-system investment. Core meta loop is **contract → cash/RP/logistics rating → facility rank → structural investment → new bottleneck → new directive**.

          ### Resources
          - Cash: facility construction and incremental equipment upgrades.
          - RP: research/perks.
          - Logistics Rating: non-spend progression earned from contracts; unlocks Facility Rank.

          ### Facility Rank
          - Rank 1 — Small Depot: current manual warehouse core.
          - Rank 2 — Warehouse: unlock at Logistics Rating 8.
          - Rank 3+ remain designed but out of Phase 1 implementation scope.

          ### Rank 2 structural investments
          - Second Inbound: ¥2,400. Inbound capacity +6; accepts inbound 22% faster, creating more revenue potential and more internal pressure.
          - Rack strategy (one permanent choice for Phase 1):
            - Fast Pick Rack: ¥2,800. Capacity +4; pick travel +25% speed.
            - High Density Rack: ¥2,800. Capacity +12; pick travel -14% speed.
          - Second Pack Line: ¥3,200. Concurrent packing capacity 1 → 2.

          Every structural investment must change both simulation behavior and the visible 3D facility. Numeric level upgrades remain secondary. No free-placement construction is introduced in Phase 1.
          """
          path.write_text(gdd)
          PY

      - name: Verify progression runtime
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/src/*.js; do node --check "$file"; done
          grep -q 'schema_version: 2' docs/src/sim.js
          grep -q 'logisticsRating' docs/src/sim.js
          grep -q 'purchaseFacility' docs/src/sim.js
          grep -q 'data-facility="secondInbound"' docs/index.html
          grep -q 'secondInboundFacility.visible' docs/src/scene.js
          node --input-type=module <<'NODE'
          import { createSimulation } from './docs/src/sim.js';
          const fresh = createSimulation(null);
          if (fresh.state.schema_version !== 2 || fresh.state.facilityRank !== 1) throw new Error('fresh progression state failed');
          if (fresh.purchaseFacility('secondInbound').ok) throw new Error('rank gate failed');
          const migrated = createSimulation({ schema_version: 1, money: 10000, research: 0, shipped: 0, completedContracts: 4, milestoneAwarded: 0, policy: 'balanced', priorities: {store:3,pick:3,ship:4}, upgrades: {}, perks: {} });
          if (migrated.state.facilityRank !== 2 || migrated.state.logisticsRating < 8) throw new Error('v1 migration/rank failed');
          migrated.state.money = 10000;
          if (!migrated.purchaseFacility('fastPickRack').ok) throw new Error('fast rack build failed');
          if (migrated.purchaseFacility('highDensityRack').ok) throw new Error('rack strategy exclusivity failed');
          if (!migrated.purchaseFacility('secondPack').ok || migrated.packCapacity() !== 2) throw new Error('second pack failed');
          console.log('Progression Spine Phase 1 smoke OK');
          NODE

      - name: Commit runtime implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/src/sim.js docs/src/main.js docs/src/ui.js docs/src/scene.js docs/index.html docs/styles.css GDD_LOGISTICS_BOSS.md
          git commit -m 'Implement Progression Spine v1 Phase 1'
          git push

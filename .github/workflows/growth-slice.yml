name: FLOTRA Growth Slice

on:
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/growth-slice.yml'

permissions:
  contents: read

jobs:
  growth-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import and compile
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --audio-driver Dummy --path godot --editor --quit 2>&1 | tee /tmp/growth-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' /tmp/growth-import.log; then exit 1; fi
      - name: Natural growth, conservation, migration and engine-input checks
        shell: bash
        run: |
          set -euo pipefail
          for test in growth_first_smoke growth_ui_smoke capacity_growth_smoke staffing_workspace_smoke capacity_flow_report; do
            XDG_DATA_HOME="/tmp/flotra-$test" timeout 100s godot --headless --audio-driver Dummy --path godot --script "res://tests/$test.gd" 2>&1 | tee "/tmp/growth-$test.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' "/tmp/growth-$test.log"; then exit 1; fi
          done
      - name: Install software render display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Capture real main scene through earned progression
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          FLOTRA_GROWTH_CAPTURE_DIR: ${{ github.workspace }}/growth-captures
          XDG_DATA_HOME: /tmp/flotra-growth-capture-fresh
        run: |
          set -euo pipefail
          mkdir -p growth-captures
          timeout 120s xvfb-run -a -s '-screen 0 390x844x24' godot --path godot --audio-driver Dummy --display-driver x11 --rendering-method gl_compatibility --script res://tests/growth_capture.gd 2>&1 | tee /tmp/growth-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' /tmp/growth-capture.log; then exit 1; fi
          for file in growth_00_fresh growth_01_forklift growth_02_expansion growth_03_working_automation growth_04_field growth_05_rank2_ui; do
            test -s "growth-captures/$file.png"
          done
      - name: Capture cumulative equipment and staffing at the same viewport
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          FLOTRA_CAPACITY_CAPTURE_DIR: ${{ github.workspace }}/growth-captures
          XDG_DATA_HOME: /tmp/flotra-capacity-capture-fresh
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a -s '-screen 0 390x844x24' godot --path godot --audio-driver Dummy --display-driver x11 --rendering-method gl_compatibility --script res://tests/capacity_capture.gd 2>&1 | tee /tmp/growth-capacity-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:' /tmp/growth-capacity-capture.log; then exit 1; fi
          for file in capacity_00_before capacity_01_first_cell capacity_02_five_additions capacity_03_staffing capacity_04_staffing_draft capacity_05_zone capacity_06_selected_route; do
            test -s "growth-captures/$file.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flotra-growth-evidence
          path: |
            growth-captures/*.png
            /tmp/growth-*.log
          retention-days: 7

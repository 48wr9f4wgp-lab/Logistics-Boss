name: Apply Rank 2 Systems Pass 2

on:
  push:
    branches: [rank2-systems-pass-2]
    paths:
      - '.github/rank2-systems-pass2-trigger-v4.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize sim return anchor and apply Rank 2 systems pass 2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/src/sim.js')
          s = p.read_text()
          old = """    staffingSummary,\n    setStaffingPlan,\n    upgradeCost,\n    perkCost,\n    facilityInfo: FACILITY_INFO,\n    upgradeInfo: UPGRADE_INFO,\n    perkInfo: PERK_INFO,\n    setPolicy,\n    setPriority,\n    setTimeScale,"""
          new = """    staffingSummary,\n    setStaffingPlan,\n    setTimeScale,\n    upgradeCost,\n    perkCost,\n    facilityInfo: FACILITY_INFO,\n    upgradeInfo: UPGRADE_INFO,\n    perkInfo: PERK_INFO,\n    setPolicy,\n    setPriority,"""
          if old not in s:
              raise SystemExit('sim return anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python tools/rank2_systems_pass2_patch.py

      - name: Verify syntax and simulation smoke
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/src/sim.js
          node --check docs/src/ui.js
          node --check docs/src/scene.js
          node --check docs/tests/progression-smoke.mjs
          node docs/tests/progression-smoke.mjs
          grep -Fq 'id="opsMiniSummary"' docs/index.html
          grep -Fq 'data-staffing-plan="picking"' docs/index.html
          grep -Fq 'data-staffing-plan="dock"' docs/index.html
          grep -Fq 'id="facilityImpact"' docs/index.html
          grep -Fq 'Fulfillment Center' docs/index.html
          grep -Fq 'function fulfillmentReadiness()' docs/src/sim.js
          grep -Fq 'function decisionImpact()' docs/src/sim.js
          grep -Fq 'Rank 2 Systems Pass — Phase 2 LOCK' GDD_LOGISTICS_BOSS.md

      - name: Commit implementation without workflow files
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/qa.yml
          rm -f tools/rank2_systems_pass2_patch.py .github/rank2-systems-pass2-trigger.txt .github/rank2-systems-pass2-trigger-v2.txt .github/rank2-systems-pass2-trigger-v3.txt .github/rank2-systems-pass2-trigger-v4.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs GDD_LOGISTICS_BOSS.md
          git add -u tools/rank2_systems_pass2_patch.py .github/rank2-systems-pass2-trigger.txt .github/rank2-systems-pass2-trigger-v2.txt .github/rank2-systems-pass2-trigger-v3.txt .github/rank2-systems-pass2-trigger-v4.txt
          git commit -m 'Add Rank 2 outcome feedback and automation readiness'
          git push origin HEAD:rank2-systems-pass-2
